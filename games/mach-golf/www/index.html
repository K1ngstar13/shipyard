<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0C1618">
<meta name="description" content="Mach Golf — a 6-week swing speed training system. Overspeed protocols, gym work, tempo trainer and speed tracking.">
<title>Mach Golf — Swing Speed Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#0C1618; --panel:#122225; --panel-2:#16292D; --line:#1E3A3F;
  --chalk:#E6EFEA; --mute:#8AA3A2; --dim:#5F7B7C;
  --speed:#FF7A2F; --amber:#FFC24A; --gain:#6FE3AE; --loss:#FF6B6B;
  --r:14px; --tap:48px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk)}
body{font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
h1,h2,h3,.num{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:23px;line-height:1.1}
h3{font-size:18px;line-height:1.15}
p{margin:0 0 10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--chalk);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:var(--tap)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--amber)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;min-height:40px;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--speed);border:3px solid var(--ink);margin-top:-12px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;background:var(--speed)}

/* shell */
#app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b));min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;position:sticky;top:0;background:linear-gradient(var(--ink) 72%,transparent);z-index:5}
.top .sub{color:var(--mute);font-size:12.5px;margin-top:3px}
.brand-lockup{display:block;width:174px;max-width:54vw;height:auto}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel);font-size:19px}

/* Gauge identity launch screen */
.brand-splash{position:fixed;inset:0;z-index:1000;background:var(--ink);display:grid;place-items:center;opacity:1;visibility:visible;transition:opacity .42s ease,visibility 0s linear .42s}
.brand-splash img{display:block;width:auto;height:100%;max-width:100%;object-fit:contain}
.brand-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,22,24,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10.5px;letter-spacing:.02em}
nav button .g{font-size:19px;line-height:1}
nav button[aria-current="true"]{color:var(--speed)}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.flat{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--mute);letter-spacing:.04em}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:11.5px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* readout */
.readout{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:.9}
.r-xl{font-size:76px}.r-l{font-size:46px}.r-m{font-size:30px}
.unit{font-family:Archivo,sans-serif;font-weight:500;font-size:13px;color:var(--mute);margin-left:5px}
.amber{color:var(--amber)}.gain{color:var(--gain)}.loss{color:var(--loss)}.speed{color:var(--speed)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:13px 16px;
  border-radius:12px;background:var(--speed);color:#150A03;font-weight:600;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);font-weight:500}
.btn.quiet{background:var(--panel-2);color:var(--chalk);font-weight:500}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;min-height:38px;display:flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--speed);color:#150A03;border-color:var(--speed);font-weight:600}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}

/* day rail */
.rail{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;width:52px;padding:9px 0;border-radius:11px;border:1px solid var(--line);background:var(--panel);text-align:center}
.rail button[aria-current="true"]{border-color:var(--speed);background:#241209}
.rail .d{font-family:'Barlow Condensed',sans-serif;font-size:19px}
.rail .w{font-size:10px;color:var(--mute)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gain);margin:4px auto 0}
.dot.off{background:var(--line)}

/* set list */
.set{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .idx{font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--dim);min-width:20px;padding-top:1px}
.set .bd{flex:1;min-width:0}
.set .nm{font-weight:600}
.check{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:transparent;font-size:16px}
.check[aria-pressed="true"]{background:var(--gain);border-color:var(--gain);color:#04120C}

/* metronome */
.orb{position:relative;width:min(72vw,268px);aspect-ratio:1;margin:6px auto 14px;border-radius:50%;
  border:1px solid var(--line);display:grid;place-items:center;background:
  radial-gradient(circle at 50% 45%,#18333A 0%,var(--panel) 62%,var(--panel) 100%)}
.orb .ring{position:absolute;inset:-1px;border-radius:50%;border:2px solid transparent;transition:border-color .09s}
.orb.on-back .ring{border-color:var(--amber)}
.orb.on-top .ring{border-color:var(--chalk)}
.orb.on-hit .ring{border-color:var(--speed);box-shadow:0 0 30px -6px var(--speed)}
.orb .lbl{font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--mute)}
.sweep{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);opacity:.85}

/* chart */
.chart{width:100%;height:168px;display:block}
.gridline{stroke:var(--line);stroke-width:1}
.line{fill:none;stroke:var(--speed);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.area{fill:url(#g1)}
.pt{fill:var(--speed)}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}
.stat .k{font-size:11px;color:var(--mute);margin-bottom:3px}
details{border-top:1px solid var(--line);padding:12px 0}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:32px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';color:var(--mute);font-size:19px}
details[open] summary::after{content:'–'}
.shot{position:relative;margin:-15px -15px 14px;border-radius:14px 14px 0 0;overflow:hidden;background:#0A1214;aspect-ratio:16/9}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .num{position:absolute;left:12px;top:12px;background:rgba(10,18,20,.82);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:13px;color:var(--chalk);backdrop-filter:blur(6px)}
.dots{display:flex;gap:7px;justify-content:center;margin:2px 0 14px}
.dots button{width:9px;height:9px;border-radius:50%;background:var(--line);padding:0}
.dots button[aria-current="true"]{background:var(--speed);width:22px;border-radius:5px}
.rec{background:#E0332E;color:#fff}
.rec i{width:13px;height:13px;border-radius:50%;background:#fff;display:inline-block}
.impband{border-left:4px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),transparent);
  border-radius:8px;padding:11px 13px;margin:0 0 12px;color:var(--c)}
.impband .impname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;line-height:1;letter-spacing:.02em}
.impband .impcount{font-size:12px;color:var(--chalk);opacity:.65;white-space:nowrap}
.impband.big{padding:15px}
.impband.big .impname{font-size:32px}
.steprow{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steprow:first-of-type{border-top:0}
.stepnum{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;color:var(--mute);flex:0 0 auto}
.steprow[data-state="done"] .stepnum{background:var(--gain);border-color:var(--gain);color:#04120C}
.steprow[data-state="now"] .stepnum{background:var(--speed);border-color:var(--speed);color:#150A03}
.steprow[data-state="todo"]{opacity:.55}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,12,13,.72);display:flex;align-items:flex-end}
.sheet .inner{background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);
  width:100%;max-width:560px;margin:0 auto;padding:18px 16px calc(24px + var(--safe-b));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.bar{height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--speed)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.brand-splash{transition:none}}
</style>
</head>

<script>
/* ============================================================
   MACH GOLF — swing speed trainer
   Single-file app. No build step, no backend, no subscription.
   ============================================================ */

/* ---------- storage: artifact host -> localStorage -> memory ---------- */
const Store=(()=>{
  const mem={};
  const ws = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function') ? window.storage : null;
  const ls = (()=>{ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }catch(e){ return null; } })();
  async function get(k){
    if(ws){ try{ const r=await ws.get(k); return r&&r.value!=null?JSON.parse(r.value):null; }catch(e){ return null; } }
    if(ls){ try{ const v=ls.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
    return k in mem?mem[k]:null;
  }
  async function set(k,v){
    const s=JSON.stringify(v); mem[k]=v;
    if(ws){ try{ await ws.set(k,s); return true; }catch(e){} }
    if(ls){ try{ ls.setItem(k,s); return true; }catch(e){} }
    return true;
  }
  return {get,set};
})();

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey=(d=new Date())=>d.toISOString().slice(0,10);
const fmtDate=k=>{const d=new Date(k+'T12:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const mph=v=>Math.round(v*10)/10;
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }

/* ---------- audio: clicks, beeps, counts ---------- */
const Audio2=(()=>{
  let ctx=null;
  function ac(){ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(freq,dur=.05,type='square',gain=.28,when=0){
    const c=ac(); if(!c) return;
    const t=c.currentTime+when;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
  }
  return { ac, tone,
    tick:()=>tone(880,.035,'square',.18),
    top:()=>tone(1320,.045,'square',.22),
    hit:()=>{tone(300,.09,'sawtooth',.3);tone(1600,.05,'square',.16);},
    done:()=>{tone(660,.09,'sine',.25,0);tone(990,.14,'sine',.25,.1);},
    start:()=>tone(520,.08,'sine',.25)
  };
})();

/* ============================================================
   TRAINING DATA
   ============================================================ */

/* Speed implements — bought or built. Weights are targets, not rules. */
const IMPLEMENTS=[
 {id:'light',name:'Light stick',target:'~20–25% lighter than your driver (≈230–250 g)',
  diy:'A single alignment stick with a rubber grip slid on, or a headless driver shaft from a broken club.',cost:'$8–15'},
 {id:'mid',name:'Mid stick',target:'About your driver weight (≈300–320 g)',
  diy:'Your actual driver. That is the point — it is the bridge between the light and heavy work.',cost:'$0'},
 {id:'heavy',name:'Heavy stick',target:'~30–50% heavier than your driver (≈420–480 g)',
  diy:'Your driver with a 1 lb ankle weight strapped just below the grip, a swing donut, or two irons gripped together.',cost:'$10–14'}
];

/* Overspeed protocols. Each step: implement, drill, reps, cue, why. */
/* Optional per-drill credit: src:{by:'Coach name', url:'https://...'}.
   Drills are described in our own words; the credit points at the original. */
function credit(o){
  if(!o||!o.src) return '';
  const by=esc(o.src.by);
  return o.src.url
    ? `<div class="tiny mute" style="margin-top:6px">Drill after <a href="${esc(o.src.url)}" target="_blank" rel="noopener">${by}</a></div>`
    : `<div class="tiny mute" style="margin-top:6px">Drill after ${by}</div>`;
}
const IMPMETA={
 light :{n:'LIGHT STICK', c:'#6FE3AE', d:'20–25% lighter than your driver'},
 mid   :{n:'MID STICK',   c:'#FFC24A', d:'about your driver weight'},
 heavy :{n:'HEAVY STICK', c:'#FF7A2F', d:'30–50% heavier than your driver'},
 driver:{n:'YOUR DRIVER', c:'#E6EFEA', d:'the club you actually play'}
};
function impBanner(id,sets){
  const m=IMPMETA[id]; if(!m) return '';
  return `<div class="impband" style="--c:${m.c}">
    <div class="row-b">
      <div><div class="tiny" style="opacity:.75">Grab your</div>
        <div class="impname">${m.n}</div></div>
      ${sets?`<span class="impcount">${sets} set${sets>1?'s':''}</span>`:''}
    </div>
    <div class="tiny" style="margin-top:4px;opacity:.8">${m.d}</div>
  </div>`;
}
const DRILLS={
 dom:{name:'Dominant-arm only',cue:'Trail arm alone, choke down, swing through to a full finish. Let the wrist unhinge late.',
      why:'Isolates the trail arm so it learns to release without the lead side bracing for it.'},
 non:{name:'Lead-arm only',cue:'Lead arm alone, same speed intent. Keep the chest turning — do not arm it.',
      why:'Builds the weaker side so your sequence stops leaking speed at the top.'},
 rev:{name:'Reverse swings',cue:'Set up as a lefty (righties) and swing the other direction, full speed.',
      why:'Rebalances the rotational load and is the single best injury-prevention rep in the program.'},
 two:{name:'Two-handed max',cue:'Normal grip, normal setup, absolute max effort. Nothing to hit, so let it go.',
      why:'This is the rep the nervous system actually remembers. Everything else feeds it.'},
 step:{name:'Step-change swing',cue:'Start feet together, step toward the target as the club reaches the top, then fire.',
      why:'Trains the ground sequence — pressure moves before the club does.'},
 knee:{name:'Kneeling swings',cue:'Tall kneeling on a mat. Legs are out of it. Rotate hard and release harder.',
      why:'Removes the legs so arm speed and release have to do the work.'},
 split:{name:'Split-grip swings',cue:'Hands 4–6 inches apart. Feel the lead hand pull and the trail hand throw.',
      why:'Makes the transition pull-then-throw obvious. Great for casters.'},
 side:{name:'Side-step swings',cue:'Two shuffle steps toward the target, then swing at the end of the second step.',
      why:'Adds momentum you have to control. Speed under motion transfers to the tee.'},
 happy:{name:'Walk-through finish',cue:'Swing max effort and let the trail foot walk through past the lead foot.',

function viewOptimize(){
  const b=baseline(), bst=best(), g=gain(), n=state.log.length;
  const pct=(b&&g)?g/b*100:null;
  let read='', moves=[];
  if(n<2){
    read='You need at least two measurements before there is anything to read. Run a retest first.';
  }else if(pct>=4){
    read=`Up ${pct.toFixed(1)}% from baseline. That is a strong response — your nervous system is taking the work.`;
    moves=[['Run the block again, heavier','Repeat the six weeks with the heavy stick 10–15% heavier. You have earned the load.'],
           ['Push the transfer reps','Add two driver swings to the end of every speed session. Gains that stay in the stick are not gains.'],
           ['Protect the gain','Keep one speed session a week in season. Speed fades faster than strength.']];
  }else if(pct>=1.5){
    read=`Up ${pct.toFixed(1)}% from baseline. Normal, real progress for six weeks.`;
    moves=[['Check adherence first','Open the checklist. Missed speed sessions cost more than missed gym sessions.'],
           ['Add contrast','Heavy stick straight into light, no rest between. That pairing produces most of the response.'],
           ['Sleep and eat','Speed work is neural. Under-slept weeks show up as flat retests within days.']];
  }else if(pct!=null){
    read=`${pct>=0?'Up':'Down'} ${Math.abs(pct).toFixed(1)}% — essentially flat. Before changing the training, rule out the measurement.`;
    moves=[['Rule out the tape','Was it in the same place both times, under the swing rather than in front of it? A tape 8 inches off reads 13% wrong.'],
           ['Rule out effort','Retests done tired or cautious read low. Retest fresh, after a full warm-up, and swing like you mean it.'],
           ['Then check adherence','If you completed under about 70% of the speed sessions, the block was not really run.'],
           ['Then change the stimulus','If all three check out, your limiter is probably strength, not speed. Run a strength block before the next speed block.']];

      `<button class="iconbtn" data-act="go" data-v="today" aria-label="Back">✕</button>`)
   + `<div class="card">

      <p class="small">${esc(read)}</p></div>
    ${moves.length?`<div class="card"><div class="eyebrow">What to change</div>
      ${moves.map((m,i)=>`<div class="set"><div class="idx">${i+1}</div><div class="bd">

const BLOCK_D=()=>WEEKS.length*7;
function dayPlan(w,d){ return (WEEKS[w-1]&&WEEKS[w-1].days[d-1])||{rest:1}; }
function dayLabel(p){

/* ---------- state ---------- */
const state={
  view:'today', ready:false,
  profile:{name:'',baseline:null,start:null,units:'mph',club:'Driver'},
  done:{}, log:[], cursor:null,
  tempo:{total:1.07,ratio:3,gap:3.2,count:true},
  session:null, gymFilter:'All'
};
async function load(){
  const p=await Store.get('mach:profile'); if(p) state.profile=Object.assign(state.profile,p);
  const d=await Store.get('mach:done'); if(d) state.done=d;
  const l=await Store.get('mach:log'); if(Array.isArray(l)) state.log=l;
  const t=await Store.get('mach:tempo'); if(t) state.tempo=Object.assign(state.tempo,t);
  state.ready=true;
}
const save=k=>Store.set('mach:'+k,state[k]);

/* position in the block.
   Counted in CALENDAR days, not elapsed milliseconds. An ms-based count from a
   noon anchor only rolls the day over at noon, so anyone opening the app in the
   morning was shown yesterday's session. Normalising both ends to local midnight
   also makes the count immune to daylight-saving shifts. */
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function daysBetween(fromKey,to){
  const [y,m,dd]=fromKey.split('-').map(Number);
  const a=new Date(y,m-1,dd);
  return Math.round((midnight(to)-a)/86400000);
}
function position(){
  if(!state.profile.start) return {w:1,d:1,off:0};
  const off=daysBetween(state.profile.start,new Date());
  const idx=clamp(off,0,BLOCK_D()-1);
  return {w:Math.floor(idx/7)+1,d:(idx%7)+1,off};
}
const key=(w,d)=>'w'+w+'d'+d;
function isDone(w,d,part){ const r=state.done[key(w,d)]; return !!(r&&r[part]); }
function setDone(w,d,part,v){
  const k=key(w,d); state.done[k]=state.done[k]||{};
  if(v) state.done[k][part]=todayKey(); else delete state.done[k][part];
  save('done');
}
function doneCount(){ let n=0; for(const k in state.done) n+=Object.keys(state.done[k]).filter(x=>x!=='note').length; return n; }
function totalParts(){ let n=0; WEEKS.forEach(wk=>wk.days.forEach(p=>{ if(p.s)n++; if(p.g)n++; if(p.t)n++; })); return n; }

/* speed math */
const best=()=>state.log.length?Math.max(...state.log.map(e=>e.speed)):null;
const latest=()=>state.log.length?state.log[state.log.length-1]:null;
function baseline(){ return state.profile.baseline||(state.log.length?state.log[0].speed:null); }
function gain(){ const b=baseline(),bst=best(); return (b&&bst)?bst-b:null; }
/* Driver carry from clubhead speed.
   The old model was carry = club x 1.48 smash x 1.75 yd-per-mph-of-ball. Both
   figures describe a tour player hitting their optimal launch window, and the
   pair overstated carry by about 12% for the golfers this app is actually for
   (a 94 mph swing was told 243 yd; the real figure is ~215).
   This is a least-squares fit through published driver benchmarks spanning
   85-120 mph club speed — PGA Tour, LPGA, scratch, 5/10/15 handicap, senior —
   and lands within 1.2% on average, 2.7% worst case. It is deliberately linear
   with a negative intercept because carry is not proportional to speed: faster
   players also launch more efficiently. Clamped below, where the fit runs out. */
const CARRY={slope:2.896,intercept:-55.4,minClub:55};
const SMASH=1.46;                    /* mean of the same benchmark set */
function estCarry(clubSpeed){
  if(!clubSpeed||clubSpeed<CARRY.minClub) return null;
  return Math.round(Math.max(0,CARRY.slope*clubSpeed+CARRY.intercept));
}
/* Marginal carry per 1 mph of club speed — the slope of that same fit. */
const YD_PER_MPH=CARRY.slope;

const TEMPO_PRESETS=[
 {n:'Driver',total:1.07,ratio:3,d:'24 frames back, 8 down — the classic tour driver rhythm.'},
 {n:'Iron',total:0.93,ratio:3,d:'Slightly quicker overall, same 3:1 shape.'},
 {n:'Wedge',total:0.87,ratio:3,d:'Short and compact, ratio holds.'},
 {n:'Smooth',total:1.20,ratio:3,d:'Longer clock for players who rush the top.'}
];
const Metro=(()=>{
  let timer=null, running=false, reps=0, onTick=null;
  function phases(){ const t=state.tempo, back=t.total*(t.ratio/(t.ratio+1)), down=t.total/(t.ratio+1); return {back,down}; }
  function cycle(){
    const {back,down}=phases(), gap=state.tempo.gap;
    Audio2.tick(); flash('back');
    setTimeout(()=>{ Audio2.top(); flash('top'); },back*1000);
    setTimeout(()=>{ Audio2.hit(); flash('hit'); reps++; if(onTick)onTick(reps); },(back+down)*1000);
    sweep(back+down);
    timer=setTimeout(cycle,(back+down+gap)*1000);
  }
  function flash(cls){
    const o=$('#orb'); if(!o) return;
    o.className='orb on-'+cls;
    const l=$('#orblbl'); if(l) l.textContent={back:'Takeaway',top:'Top',hit:'Impact'}[cls];
    clearTimeout(o._t); o._t=setTimeout(()=>{o.className='orb';},cls==='hit'?260:160);
  }
  function sweep(dur){
    const el=$('#sweep'); if(!el) return;
    const t0=performance.now();
    (function step(now){ if(!running) {el.style.setProperty('--p',0); return;}
      const p=(now-t0)/(dur*1000); el.style.setProperty('--p',Math.min(1,p));
      if(p<1) requestAnimationFrame(step); else setTimeout(()=>el.style.setProperty('--p',0),120);
    })(t0);
  }
  return {
    start(cb){ if(running) return; Audio2.ac(); running=true; onTick=cb; Audio2.start(); setTimeout(cycle,500); },
    stop(){ running=false; clearTimeout(timer); const l=$('#orblbl'); if(l)l.textContent='Ready'; const o=$('#orb'); if(o)o.className='orb'; },
    reset(){ reps=0; },
    get running(){return running;}, get reps(){return reps;}, phases
  };
})();

function chart(entries){
  if(entries.length<2) return '';
  const W=520,H=168,pad=14;
  const vals=entries.map(e=>e.speed);
  const min=Math.min(...vals)-2, max=Math.max(...vals)+2, span=(max-min)||1;
  const x=i=>pad+(i*(W-pad*2)/(entries.length-1));
  const y=v=>H-pad-((v-min)/span)*(H-pad*2);
  const pts=entries.map((e,i)=>[x(i),y(e.speed)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${W-pad} ${H-pad} L ${pad} ${H-pad} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Swing speed over time">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A2F" stop-opacity=".28"/><stop offset="100%" stop-color="#FF7A2F" stop-opacity="0"/>
    </linearGradient></defs>
    <line class="gridline" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>
    <path class="area" d="${area}"/><path class="line" d="${d}"/>
    ${pts.map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('')}
  </svg>`;
}

/* ============================================================
   ADHERENCE MODEL
   A planning projection, not a measurement. Six weeks is a shorter
   block than eight, so the budget is smaller: roughly 2.5-6%. This
   splits that budget
   across the three kinds of session so a missed one has a visible
   size. Your own retests overwrite the guess with a fact.
   ============================================================ */
const MODEL={pct:0.045,lo:0.025,hi:0.06,w:{speed:0.60,gym:0.25,tempo:0.15}};
const KINDNAME={speed:'Speed session',gym:'Gym session',tempo:'Tempo work'};
function partCounts(){
  const c={speed:0,gym:0,tempo:0};
  WEEKS.forEach(wk=>wk.days.forEach(p=>{ if(p.s)c.speed++; if(p.g)c.gym++; if(p.t)c.tempo++; }));
  return c;
}
function doneByKind(){
  const c={speed:0,gym:0,tempo:0};
  for(const k in state.done) for(const part in state.done[k]) if(part in c) c[part]++;
  return c;
}
function perSessionMph(kind){
  const b=baseline(); if(!b) return null;
  return b*MODEL.pct*MODEL.w[kind]/partCounts()[kind];
}
function projection(){
  const b=baseline(); if(!b) return null;
  const tot=partCounts(), got=doneByKind();
  const full=b*MODEL.pct;
  let earned=0;
  for(const k in tot) earned+=full*MODEL.w[k]*(got[k]/tot[k]);
  const elapsed=Math.max(1,Math.min(BLOCK_D(),position().off+1));
  const expected=elapsed/BLOCK_D();
  let onPace=0; for(const k in tot) onPace+=full*MODEL.w[k]*expected;
  return {full,earned,onPace,lo:b*MODEL.lo,hi:b*MODEL.hi};
}
/* Sessions scheduled before today that were never ticked off. */
function missed(){
  const pos=position(), now=(pos.w-1)*7+pos.d;
  const out=[];
  WEEKS.forEach(wk=>wk.days.forEach((p,i)=>{
    const d=i+1, abs=(wk.w-1)*7+d;
    if(abs>=now) return;
    ['speed','gym','tempo'].forEach(kind=>{
      const has=(kind==='speed'&&p.s)||(kind==='gym'&&p.g)||(kind==='tempo'&&p.t);
      if(has&&!isDone(wk.w,d,kind)) out.push({w:wk.w,d,kind});
    });
  }));
  return out;
}
function missedCard(){
  const m=missed(); if(!m.length) return '';
  const b=baseline();
  let cost=0; m.forEach(x=>{ const v=perSessionMph(x.kind); if(v) cost+=v; });
  const by={}; m.forEach(x=>by[x.kind]=(by[x.kind]||0)+1);
  return `<div class="card" style="border-color:#5A3A1A">
    <div class="eyebrow amber">Behind the plan</div>
    <h2 style="margin:4px 0 8px">${m.length} session${m.length>1?'s':''} not ticked off</h2>
    <div class="small mute" style="margin-bottom:10px">${Object.keys(by).map(k=>`${by[k]} × ${KINDNAME[k].toLowerCase()}`).join(' · ')}</div>
    ${b?`<div class="readout r-l loss">−${mph(cost)}<span class="unit">mph off the projection</span></div>
      <p class="small mute" style="margin-top:10px">On the app's model that is what those sessions were worth. Nothing is lost permanently — shift them later in the week and keep 48 hours between speed sessions. If you would rather not see this, tick them off or mark the day as rest.</p>`
     :`<p class="small mute">Record a baseline speed and this will show what the gap is worth in mph.</p>`}
    <button class="btn quiet" style="margin-top:10px" data-act="go" data-v="train">Open the checklist</button></div>`;
}
function projectionCard(){
  const pr=projection(); if(!pr) return '';
  const pct=Math.round(pr.earned/pr.full*100);
  return `<div class="card">

/* Journal */

/* ============================================================
   GARAGE SPEED TEST
   Calibration lives in the same frame as the swing, so camera
   distance cancels:  moving the phone scales pixels-per-inch and
   pixels-of-travel by the same factor.  Laying the reference along
   the line of travel cancels camera angle too.
   mph = (inches per frame x capture fps) x 0.0568182
   ============================================================ */
const REFS=[
 {n:'Tape measure',in:36,h:'Extend it to 36 inches on the floor along the target line, running under the bottom of your swing. Lock it.'},
 {n:'Alignment stick',in:48,h:'On the floor along the target line, under the bottom of your swing.'},
 {n:'Yardstick',in:36,h:'On the floor along the target line, under the bottom of your swing.'},
 {n:'Custom',in:36,h:'Anything rigid and straight of known length, lying along the line the clubhead travels.'}
];
const cam={ step:1, v:null, cv:null, ctx:null, url:null,
  fileFps:30, captureFps:240, detected:false, t:0, frames:2, autoFrames:true,
  setup:0, refI:0, refIn:36, refA:null, refB:null, refM:null, A:null, B:null,
  mode:'ref', target:'club', swings:[], arcR:65 };

const MPH_PER_IPS=1/17.6;            /* 1 in/s in mph: 63360 in per mile / 3600 s */

const realDt=()=>1/cam.captureFps;

/* ---- two-point scale: uniform pixels-per-inch ---------------------------
   Exact only when the camera is square to the reference. Kept as the simple
   path and as the fallback when no middle mark has been placed. */
const pxPerIn=()=>{
  if(!cam.refA||!cam.refB||!cam.refIn) return null;
  const px=Math.hypot(cam.refB.x-cam.refA.x,cam.refB.y-cam.refA.y);
  return px>5?px/cam.refIn:null;
};

/* ---- three-point projective scale --------------------------------------
   Moving the phone closer scales the ruler and the swing together, so camera
   DISTANCE cancels exactly. Camera ANGLE does not. Yaw tilts the tape out of
   the sensor plane, so pixels-per-inch varies ALONG the tape, and a clubhead
   measured away from the tape's centre is scaled by the wrong number: at 20
   degrees of yaw with the low point 10 inches off centre that is -11%, and at
   30 degrees it is -16%. A single average scale cannot represent a varying one.
   Three known collinear marks (0, middle, end) determine the 1-D projective
   map t = (a*x + b)/(c*x + 1) that a pinhole camera actually applies, which
   recovers true inches at any point on the line. Verified against a pinhole
   simulation: exact to 1e-9 % at every yaw angle and every offset tested. */
function projFit(){
  if(!cam.refA||!cam.refB||!cam.refM||!cam.refIn) return null;
  const ux=cam.refB.x-cam.refA.x, uy=cam.refB.y-cam.refA.y;
  const L=Math.hypot(ux,uy); if(L<20) return null;
  const ax=ux/L, ay=uy/L;                       /* unit vector along the ruler */
  const proj=p=>((p.x-cam.refA.x)*ax+(p.y-cam.refA.y)*ay);
  const xm=proj(cam.refM);
  /* the middle mark must sit strictly between the ends to be usable */
  if(!(xm>L*0.12&&xm<L*0.88)) return null;
  const pts=[[0,0],[xm,cam.refIn/2],[L,cam.refIn]];
  /* solve  a*x + b - c*x*t = t  for (a,b,c) */
  const M=pts.map(([x,t])=>[x,1,-x*t,t]);
  for(let i=0;i<3;i++){
    let piv=i;
    for(let r=i+1;r<3;r++) if(Math.abs(M[r][i])>Math.abs(M[piv][i])) piv=r;
    if(Math.abs(M[piv][i])<1e-12) return null;
    [M[i],M[piv]]=[M[piv],M[i]];
    const d=M[i][i]; for(let k=i;k<4;k++) M[i][k]/=d;
    for(let r=0;r<3;r++) if(r!==i&&M[r][i]){
      const f=M[r][i]; for(let k=i;k<4;k++) M[r][k]-=f*M[i][k];
    }
  }
  const [a,b,c]=[M[0][3],M[1][3],M[2][3]];
  if(!isFinite(a)||!isFinite(b)||!isFinite(c)) return null;
  return {a,b,c,ax,ay,L,
    o:cam.refA,
    /* inches along the ruler at an image point */
    t(p){ const x=(p.x-this.o.x)*this.ax+(p.y-this.o.y)*this.ay, den=this.c*x+1;
          return Math.abs(den)<1e-12?null:(this.a*x+this.b)/den; },
    /* local inches-per-pixel, for motion across the ruler rather than along it */
    ipp(p){ const x=(p.x-this.o.x)*this.ax+(p.y-this.o.y)*this.ay, den=this.c*x+1;
            return Math.abs(den)<1e-12?null:Math.abs((this.a-this.b*this.c)/(den*den)); },
    /* how far the middle mark sits from the midpoint of the ends: a direct
       read on how square the camera is, in percent of the span */
    skew:(xm-L/2)/L*100 };
}

/* Straight-line pixel distance between two marks, converted to inches. */
function markInches(){
  if(!cam.A||!cam.B) return null;
  const fit=projFit();
  if(fit){
    const tA=fit.t(cam.A), tB=fit.t(cam.B);
    if(tA==null||tB==null) return null;
    const along=tB-tA;
    /* component across the ruler, scaled locally */
    const mid={x:(cam.A.x+cam.B.x)/2,y:(cam.A.y+cam.B.y)/2};
    const dx=cam.B.x-cam.A.x, dy=cam.B.y-cam.A.y;
    const perpPx=Math.abs(dx*(-fit.ay)+dy*fit.ax);
    const ipp=fit.ipp(mid)||0;
    return {inches:Math.hypot(along,perpPx*ipp),mode:'projective',skew:fit.skew};
  }
  const k=pxPerIn(); if(!k) return null;
  return {inches:Math.hypot(cam.B.x-cam.A.x,cam.B.y-cam.A.y)/k,mode:'linear',skew:null};
}

/* The clubhead travels an arc; two marks measure the straight chord between
   them, which is always slightly short. Over 2 frames on a ~65 in radius that
   is 0.21%, rising to 0.85% over 4 frames, so it is worth undoing. */
function arcCorrect(chord){
  const R=cam.arcR;
  if(!R||chord<=0||chord>=2*R) return chord;
  return 2*R*Math.asin(Math.min(1,chord/(2*R)));
}

function camSpeed(){
  const mk=markInches(); if(!mk) return null;
  const secs=cam.frames*realDt(); if(!secs) return null;
  const inches=cam.target==='club'?arcCorrect(mk.inches):mk.inches;
  const v=(inches/secs)*MPH_PER_IPS;
  /* A dry swing has no ball, so ball speed is not measured — only implied by
     an assumed smash factor. Flag it so nothing downstream presents it as data. */
  return cam.target==='ball'
    ? {ball:v, club:v/SMASH, measuredBall:true,  mode:mk.mode, skew:mk.skew}
    : {ball:v*SMASH, club:v, measuredBall:false, mode:mk.mode, skew:mk.skew};
}
function stats(a){
  if(!a.length) return null;
  const n=a.length, mean=a.reduce((x,y)=>x+y,0)/n;
  const sd=n>1?Math.sqrt(a.reduce((x,y)=>x+(y-mean)**2,0)/(n-1)):0;
  return {n,mean,sd,cv:mean?sd/mean*100:0,best:Math.max(...a)};
}
function spreadVerdict(cv){
  if(cv<3) return {t:'Tight. Your setup is repeatable.',c:'gain'};
  if(cv<6) return {t:'Normal spread for real swings.',c:'mute'};
  return {t:'Wide. Mark the same part of the clubhead every time, and check the tape has not moved.',c:'loss'};
}

/* ---- the garage rig, drawn ---- */
const SETUP=[
 {k:'tape', t:'Lay the tape under your swing',

  b:'Facing you, roughly square to the tape. Lean it on a box, a shoe, or a small tripod — anything that holds still.',

  b:'Check the screen before you swing: both ends of the tape in shot, clubhead near the middle.',

function camStep1(){
  const i=clamp(cam.setup||0,0,SETUP.length-1), c=SETUP[i], last=i===SETUP.length-1;
  return `<div class="card" id="setupcard">
    <div class="shot"><img src="${SETUP_IMG[c.k]}" alt="${esc(c.alt)}">
      <div class="num">Step ${i+1} of ${SETUP.length}</div></div>
    <div class="dots">${SETUP.map((_,j)=>
      `<button data-act="setupgo" data-i="${j}" aria-current="${j===i}" aria-label="Step ${j+1}"></button>`).join('')}</div>
    <h2>${esc(c.t)}</h2>
    <p class="small" style="margin:8px 0 6px">${c.b}</p>
    <p class="small mute">${esc(c.n)}</p>
    ${last?`<button class="btn rec" data-act="camstep2" style="margin-top:14px"><i></i> Recorded — load the clip</button>`
          :`<button class="btn" data-act="setupnext" style="margin-top:14px">Next</button>`}

}

/* ---- steps 2-4 share the video stage ---- */

function camStep3(){
  return `<div class="card">
    <div class="row-b"><h2>Calibrate</h2><span class="tag">step 2 of 3</span></div>
    <p class="small mute" style="margin:8px 0 10px">Scrub to any frame where the tape is clear, then tap three marks in order: <span class="amber">0 in</span>, <span class="amber">${cam.refIn} in</span>, then the <span class="gain">halfway mark (${(cam.refIn/2)} in)</span>. Drag to fine-tune with the magnifier.</p>
    <div class="chips" style="margin-bottom:10px">${REFS.map((r,i)=>

    <div class="row-b" style="gap:8px">

    <div class="flat" style="margin-top:12px;padding:11px">
      <div class="tiny mute">Why the third mark: moving the phone closer or further away cancels out exactly, but <span class="chalk">turning it does not</span>. An angled camera squeezes the far end of the tape, so inches-per-pixel changes along it. The halfway mark measures that squeeze and removes it — worth up to 11 mph if your phone is off square and the ball is not dead centre. Skip it and you get the simple two-point scale instead.</div>
    </div>
    <button class="btn" style="margin-top:12px" data-act="camstep4">Measure my swings</button>
    ${cam.refA&&cam.refB&&!cam.refM?`<button class="btn ghost" style="margin-top:8px" data-act="camstep4">Skip the middle mark</button>`:''}
  </div>`;
}
function camStep4(){
  const st=stats(cam.swings.map(x=>x.club));
  const v=st&&st.n>1?spreadVerdict(st.cv):null;
  const r=camSpeed();
  return `<div class="card">
    <div class="row-b"><h2>Measure</h2><span class="tag">swing ${cam.swings.length+1}</span></div>
    <p class="small mute" style="margin:8px 0 12px">Step to the frame where the clubhead is at the <span class="amber">bottom of the arc</span>, go back one and mark it. Step forward two frames and mark it again. Click the same part of the blur both times — the app counts the frames for you.</p>
    <div class="chips" style="margin-bottom:12px">
      <button class="chip" data-act="camtarget" data-t="club" aria-pressed="${cam.target==='club'}">Clubhead</button>
      <button class="chip" data-act="camtarget" data-t="ball" aria-pressed="${cam.target==='ball'}">Ball</button>
    </div>
    <div class="grid2">
      <button class="btn ${cam.mode==='A'?'':'ghost'}" data-act="cammode" data-m="A">Mark first</button>
      <button class="btn ${cam.mode==='B'?'':'ghost'}" data-act="cammode" data-m="B">Mark second</button></div>
    <div class="row-b" style="margin-top:12px;gap:8px">
      <span class="small mute" style="white-space:nowrap">Frames apart</span>
      <span class="small ${cam.autoFrames?'gain':'mute'}" style="flex:1;text-align:right">
        ${cam.autoFrames?`counted automatically: <span class="readout" style="font-size:19px">${cam.frames}</span>`:''}</span>
      ${cam.autoFrames?'':`<input type="number" min="1" max="12" id="camframes" value="${cam.frames}" style="width:70px">`}
      <button class="chip" data-act="camautofr">${cam.autoFrames?'set by hand':'auto'}</button></div>
    ${cam.frames>4?`<div class="small amber" style="margin-top:8px">${cam.frames} frames is a wide window. The clubhead is slowing after the low point, so a long span reads below peak — two frames is the sweet spot.</div>`:''}
    <div id="camone" style="margin-top:14px"></div>
  </div>
  <div class="card">
    <div class="row-b"><h2>This test</h2>${st?`<span class="tag">${st.n} swing${st.n>1?'s':''}</span>`:''}</div>
    ${st?`<div class="grid3" style="margin:12px 0">
        <div class="stat"><div class="k">Average</div><div class="readout r-m speed">${mph(st.mean)}</div></div>
        <div class="stat"><div class="k">Best</div><div class="readout r-m">${mph(st.best)}</div></div>
        <div class="stat"><div class="k">Spread</div><div class="readout r-m">±${mph(st.sd)}</div></div></div>
      ${v?`<div class="small ${v.c}">${esc(v.t)}</div>`:''}
      ${cam.swings.map((x,i)=>`<div class="set"><div class="idx">${i+1}</div>
        <div class="bd"><div class="nm">${mph(x.club)} mph</div></div>
        <button class="chip" data-act="camdel" data-i="${i}" aria-label="Remove swing ${i+1}">×</button></div>`).join('')}
      ${st.n>=5?`<button class="btn" style="margin-top:12px" data-act="camsave">Save this test — ${mph(st.mean)} mph average</button>`
        :`<div class="small mute" style="margin-top:12px">Add ${5-st.n} more swing${5-st.n>1?'s':''}. Five is the minimum for an average worth trusting; ten is better.</div>
          <button class="btn ghost" style="margin-top:10px" data-act="camsave">Save anyway</button>`}`
    :`<p class="small mute" style="margin-top:8px">No swings recorded yet. Mark two frames above and add your first.</p>`}
  </div>`;
}
function camOne(){
  const el=$('#camone'); if(!el) return;
  const r=camSpeed();
  if(!r){ el.innerHTML=`<div class="small mute">Mark the clubhead in two frames.</div>`; return; }
  const ok=r.club>30&&r.club<160;
  el.innerHTML=`<div class="row-b">
      <div><div class="k small mute">This swing</div>
        <div class="readout r-l ${ok?'speed':'loss'}">${mph(r.club)}<span class="unit">mph club</span></div></div>
      <button class="chip" data-act="camadd" ${ok?'':'disabled'} style="min-height:44px;padding:0 16px">Add swing</button></div>
    ${ok?`<div class="tiny mute" style="margin-top:6px">${cam.frames} frames · ${r.mode==='projective'?'angle-corrected':'2-point scale'}${estCarry(r.club)?` · ≈ ${estCarry(r.club)} yd carry`:''}</div>`:`<div class="small loss" style="margin-top:8px">Outside the range of a real golf swing. Check your capture rate and that the reference length is right.</div>`}`;
}

function viewCam(){
  const steps=['Set up','Clip','Calibrate','Measure'];
  const rail=`<div class="chips" style="margin-bottom:12px">${steps.map((n,i)=>
    `<button class="chip" data-act="camgo" data-s="${i+1}" aria-pressed="${cam.step===i+1}">${i+1} · ${n}</button>`).join('')}</div>`;
  let body='';
  if(cam.step===1) body=camStep1();
  else if(cam.step===2) body=camStep2()+(cam.url?camStage():'');
  else if(cam.step===3) body=camStage()+camStep3();
  else body=camStage()+camStep4();
  return `<div class="top"><div><h1>Speed test</h1><div class="sub">Garage setup, no radar</div></div>
      <button class="iconbtn" data-act="go" data-v="today" aria-label="Back">✕</button></div>`+rail+body;
}

/* ---- canvas plumbing ---- */
function camDraw(){
  if(!cam.v||!cam.ctx||!cam.cv) return;
  const c=cam.ctx, v=cam.v;
  cam.cv.width=v.videoWidth||640; cam.cv.height=v.videoHeight||360;
  c.drawImage(v,0,0,cam.cv.width,cam.cv.height);
  const sc=cam.cv.width/900;
  const cross=(p,col,lbl)=>{ if(!p) return;
    c.strokeStyle=col; c.lineWidth=2.5*sc; c.beginPath();
    c.moveTo(p.x-16*sc,p.y); c.lineTo(p.x+16*sc,p.y); c.moveTo(p.x,p.y-16*sc); c.lineTo(p.x,p.y+16*sc); c.stroke();
    c.beginPath(); c.arc(p.x,p.y,9*sc,0,7); c.stroke();
    if(lbl){ c.fillStyle=col; c.font=`${16*sc}px sans-serif`; c.fillText(lbl,p.x+20*sc,p.y-12*sc); } };
  if(cam.refA&&cam.refB){ c.strokeStyle='#FFC24A'; c.lineWidth=2*sc; c.setLineDash([7*sc,5*sc]);
    c.beginPath(); c.moveTo(cam.refA.x,cam.refA.y); c.lineTo(cam.refB.x,cam.refB.y); c.stroke(); c.setLineDash([]); }
  cross(cam.refA,'#FFC24A'); cross(cam.refB,'#FFC24A','ruler');
  cross(cam.refM,'#6FE3AE','mid');
  if(cam.A&&cam.B){ c.strokeStyle='#FF7A2F'; c.lineWidth=2.5*sc;
    c.beginPath(); c.moveTo(cam.A.x,cam.A.y); c.lineTo(cam.B.x,cam.B.y); c.stroke(); }
  cross(cam.A,'#FF7A2F','1'); cross(cam.B,'#FF7A2F','2');
  const f=$('#camframe'); if(f) f.textContent=camFrameNo();
  const k=pxPerIn(), fit=projFit(), rs=$('#camrefstate');
  if(rs) rs.innerHTML = !k ? 'not set'
    : `${(k*cam.refIn).toFixed(0)} px across ${cam.refIn} in`
      + (fit?` · <span class="gain">square-camera correction on</span>`
            :` · <span class="amber">add the middle mark for the angle correction</span>`);
  const wn=$('#camcalwarn');
  let warn='';
  if(k&&k*cam.refIn<400) warn+=`<div class="small loss" style="margin-top:8px">Your ruler is only ${(k*cam.refIn).toFixed(0)} px long. Under about 400 px the tap error starts to dominate — move the phone closer or extend the tape further.</div>`;
  if(fit){
    const sk=Math.abs(fit.skew);
    warn+= sk<1.0
      ? `<div class="small gain" style="margin-top:8px">Camera is square to the tape (${fit.skew.toFixed(1)}% skew). Nothing to correct.</div>`
      : `<div class="small ${sk>4?'loss':'amber'}" style="margin-top:8px">Camera is off square by ${fit.skew.toFixed(1)}% skew${sk>4?' — quite a lot':''}. The angle correction is handling it, but squaring the phone up next time gives you a cleaner number.</div>`;
  }
  if(wn) wn.innerHTML=warn;
  camOne();
}
function camSeek(t){ if(!cam.v) return;
  cam.t=clamp(t,0,Math.max(0,(cam.v.duration||0)-0.0005)); cam.v.currentTime=cam.t; }
function camPoint(e){
  const cv=cam.cv, r=cv.getBoundingClientRect();
  return {x:clamp((e.clientX-r.left)*(cv.width/r.width),0,cv.width),
          y:clamp((e.clientY-r.top)*(cv.height/r.height),0,cv.height)};
}
function camLoupe(p,show){
  const l=$('#loupe'); if(!l) return;
  l.style.display=show?'block':'none'; if(!show) return;
  const g=l.getContext('2d'), z=5, w=150/z;
  g.fillStyle='#000'; g.fillRect(0,0,150,150);
  g.drawImage(cam.cv,p.x-w/2,p.y-w/2,w,w,0,0,150,150);
  g.strokeStyle='#FF7A2F'; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(75,58); g.lineTo(75,92); g.moveTo(58,75); g.lineTo(92,75); g.stroke();
}
/* Which frame of the file is showing right now. */
const camFrameNo=()=>Math.round(cam.t*cam.fileFps);

function camCommit(p){
  if(cam.mode==='ref'){
    /* cycle: start -> end -> middle -> start again */
    if(!cam.refA||(cam.refA&&cam.refB&&cam.refM)){ cam.refA=p; cam.refB=null; cam.refM=null; }
    else if(!cam.refB) cam.refB=p;
    else cam.refM=p;
  }
  /* Record which frame each clubhead mark came from. The gap between the two
     was a number the user typed, and typing 2 after stepping 3 reports a speed
     50% high — the largest error the app could produce. The app already knows
     the frame index, so it counts them itself. */
  else if(cam.mode==='A'){ cam.A=p; cam.A.f=camFrameNo(); }
  else if(cam.mode==='B'){ cam.B=p; cam.B.f=camFrameNo(); }
  syncFrames();
  camDraw();
}
function syncFrames(){
  if(!cam.autoFrames||!cam.A||!cam.B||cam.A.f==null||cam.B.f==null) return;
  const n=Math.abs(cam.B.f-cam.A.f);
  if(n>0) cam.frames=n;
}

/* Container timestamps quantise, so a 240 fps file can measure as 250 and cost 4%.
   Snap to a rate a camera would actually have shot at. */
const STD_FPS=[23.976,24,25,29.97,30,50,59.94,60,100,119.88,120,200,239.76,240,480,960];
function snapFps(f){
  if(!f||!isFinite(f)) return null;
  let bestv=null,err=1;
  STD_FPS.forEach(x=>{ const e=Math.abs(f-x)/x; if(e<err){ err=e; bestv=x; } });
  /* No standard rate within 6%? Then we did not really read it. Say so rather
     than handing back a number the whole measurement will silently trust. */
  return err<0.06?bestv:null;
}
function camDetectFps(v){
  return new Promise(res=>{
    if(!v.requestVideoFrameCallback) return res(null);
    const ts=[]; let stop=false;
    const done=()=>{ if(stop) return; stop=true; v.pause(); v.playbackRate=1; v.currentTime=0;
      const d=[]; for(let i=1;i<ts.length;i++){ const x=ts[i]-ts[i-1]; if(x>0.0005) d.push(x); }
      if(d.length<3) return res(null);
      /* A dropped frame produces a delta that is a MULTIPLE of the true interval,
         never a fraction of it. The median would then read 120 on a 240 fps file —
         silently halving every speed. The low quartile ignores drops while still
         rejecting single noisy samples. */
      d.sort((a,b)=>a-b);
      res(snapFps(1/d[Math.floor(d.length*0.25)]));
    };
    const cb=(now,meta)=>{ ts.push(meta.mediaTime); if(ts.length>14||v.ended) return done(); v.requestVideoFrameCallback(cb); };
    v.playbackRate=0.25; v.muted=true;
    v.play().then(()=>{ v.requestVideoFrameCallback(cb); setTimeout(done,3500); }).catch(()=>res(null));
  });
}

function mountCam(){
  const sc=$('#setupcard');
  if(sc){
    const nxt=SETUP[(cam.setup||0)+1];
    if(nxt){ const im=new Image(); im.src=SETUP_IMG[nxt.k]; }
    let x0=null;
    sc.addEventListener('pointerdown',e=>{ x0=e.clientX; });
    sc.addEventListener('pointerup',e=>{
      if(x0===null) return; const dx=e.clientX-x0; x0=null;
      if(Math.abs(dx)<48) return;
      cam.setup=clamp((cam.setup||0)+(dx<0?1:-1),0,SETUP.length-1); render();
    });
    sc.addEventListener('pointercancel',()=>{ x0=null; });
  }
  cam.cv=$('#camcv');
  if(cam.cv){
    cam.ctx=cam.cv.getContext('2d',{willReadFrequently:true});
    let live=null;
    cam.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cam.cv.setPointerCapture(e.pointerId);
      live=camPoint(e); camLoupe(live,true); });
    cam.cv.addEventListener('pointermove',e=>{ if(!live) return; live=camPoint(e); camLoupe(live,true); });
    cam.cv.addEventListener('pointerup',()=>{ if(!live) return; camLoupe(live,false); camCommit(live); live=null; });
    cam.cv.addEventListener('pointercancel',()=>{ camLoupe(null,false); live=null; });
    if(cam.v) setTimeout(camDraw,60);
  }
  ['camrefin','camframes','camfps'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{
      const n=parseFloat(el.value);
      if(id==='camrefin'&&n>0) cam.refIn=n;
      if(id==='camframes'&&n>0) cam.frames=Math.round(n);
      if(id==='camfps'&&n>0) cam.fileFps=n;
      const dt=$('#camdt'); if(dt) dt.textContent=(realDt()*1000).toFixed(2)+' ms';
      camDraw();
    });
  });
  const fi=$('#camfile');
  if(fi) fi.addEventListener('change',async ev=>{
    const f=ev.target.files&&ev.target.files[0]; if(!f) return;
    const st=$('#camstatus'); st.textContent='Reading the video…';
    if(cam.url) URL.revokeObjectURL(cam.url);
    cam.url=URL.createObjectURL(f);
    document.querySelectorAll('video[data-cam]').forEach(x=>x.remove());
    const v=document.createElement('video');
    v.setAttribute('data-cam','1'); v.setAttribute('playsinline','');
    v.playsInline=true; v.muted=true; v.preload='auto';
    v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';
    document.body.appendChild(v); v.src=cam.url;
    cam.v=v; cam.A=cam.B=cam.refA=cam.refB=null; cam.t=0;
    v.addEventListener('seeked',camDraw);
    const ok=await new Promise(r=>{
      v.addEventListener('loadeddata',()=>r(true),{once:true});
      v.addEventListener('error',()=>r(false),{once:true});
      setTimeout(()=>r(v.readyState>=2),8000); });
    if(!ok||!v.videoWidth){ st.innerHTML='<span class="loss">This browser cannot decode that file. Export it as MP4 and try again.</span>'; return; }
    st.textContent='Working out the frame rate…';
    /* Detection rides on playback timing and can miss under load. One retry
       costs a second and removes almost every false "unreadable". */
    let fps=await camDetectFps(v);
    if(!fps){ v.currentTime=0; await new Promise(r=>setTimeout(r,250)); fps=await camDetectFps(v); }
    cam.detected=!!(fps&&fps>5&&fps<1100);
    if(cam.detected) cam.fileFps=Math.round(fps*1000)/1000;
    cam.captureFps = cam.fileFps>=100 ? cam.fileFps : 240;
    render();
    $('#camstatus').innerHTML = cam.detected
      ? `${v.videoWidth}×${v.videoHeight} · ${cam.fileFps} fps in the file`
        + (cam.fileFps<100?` · <span class="amber">stretched slow motion — confirm your capture rate</span>`:'')
      : `${v.videoWidth}×${v.videoHeight} · <span class="amber">frame rate unreadable — set both rates by hand</span>`;
    camSeek(0.001); setTimeout(camDraw,260);
  });
  camOne();
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
function render(){
  const v=state.view;
  const html = v==='session'?viewSession()
    : v==='train'?viewTrain()
    : v==='gym'?viewGym()
    : v==='tempo'?viewTempo()
    : v==='progress'?viewProgress()
    : v==='cam'?viewCam()
    : v==='steps'?viewSteps()
    : v==='gear'?viewGear()
    : v==='optimize'?viewOptimize()
    : viewToday();
  $('#app').innerHTML=html;
  renderNav();
  if(v==='cam') mountCam();
  document.querySelector('nav').style.display = v==='session'?'none':'';
  if(v!=='session') window.scrollTo(0,0);
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;

  if(a!=='metro'&&a!=='preset'&&Metro.running&&state.view!=='tempo') Metro.stop();

  switch(a){
    case 'go': state.view=el.dataset.v; if(state.view!=='tempo') Metro.stop(); render(); break;
    case 'settings': settingsSheet(); break;
    case 'gear': state.view='gear'; render(); break;
    case 'gotgear':
      state.profile.gear=!state.profile.gear; await save('profile');
      toast(state.profile.gear?'Equipment ready':'Unmarked'); render(); break;
    case 'closesheet': closeSheet(); break;
    case 'logsheet': logSheet(); break;
    case 'ics': icsExport(); break;

    case 'startblock':
      state.profile.start=todayKey(); await save('profile');
      state.view='today'; toast('Week 1 starts today'); render(); break;

    case 'toggle':{
      const w=+el.dataset.w,d=+el.dataset.d,k=el.dataset.kind;
      setDone(w,d,k,!isDone(w,d,k)); render(); break; }
    case 'week': state.cursor={w:+el.dataset.w,d:1}; render(); break;
    case 'day': state.cursor={w:+el.dataset.w,d:+el.dataset.d}; render(); break;
    case 'gymfilter': state.gymFilter=el.dataset.c; render(); break;
    case 'savejrnl':{
      const t=$('#jrnl'); if(!t) break;
      setJournal(+el.dataset.w,+el.dataset.d,t.value.trim()); toast('Note saved'); break; }

    case 'startspeed':
      state.session={kind:'speed',id:el.dataset.id,w:+el.dataset.w,d:+el.dataset.d,i:0,rest:0};
      state.view='session'; Audio2.ac(); render(); break;
    case 'startgym':
      state.session={kind:'gym',id:el.dataset.id,w:+el.dataset.w,d:+el.dataset.d,i:0,rest:0,checks:[]};
      state.view='session'; render(); break;
    case 'setdone':{
      const s2=state.session, pr=PROTOCOLS[s2.id];
      s2.i++;
      if(s2.i>=pr.sets.length){ render(); }
      else { const heavy=pr.sets[s2.i-1].imp==='heavy'; startRest(heavy?50:40); }
      break; }
    case 'skiprest': clearInterval(restTimer); state.session.rest=0; render(); break;
    case 'nextset': state.session.i++; state.session.rest=0; render(); break;
    case 'prevset': state.session.i=Math.max(0,state.session.i-1); state.session.rest=0; render(); break;
    case 'rest': startRest(+el.dataset.s); break;
    case 'gymcheck':{
      const s2=state.session, id=el.dataset.id;
      s2.checks=s2.checks||[];
      s2.checks=s2.checks.includes(id)?s2.checks.filter(x=>x!==id):s2.checks.concat([id]);
      render(); break; }
    case 'quit': clearInterval(restTimer); state.session=null; state.view='today'; render(); break;
    case 'finish':{
      const s2=state.session; clearInterval(restTimer);
      setDone(s2.w,s2.d,s2.kind,true);
      state.session=null; state.view='today'; Audio2.done(); toast('Session logged'); render(); break; }

    case 'metro':
      if(Metro.running){ Metro.stop(); }
      else { Metro.start(n=>{ const x=$('#repcount'); if(x) x.textContent=n; }); }
      render(); break;
    case 'preset':{
      const pz=TEMPO_PRESETS[+el.dataset.i];
      state.tempo.total=pz.total; state.tempo.ratio=pz.ratio; await save('tempo');
      const was=Metro.running; Metro.stop(); render();
      if(was){ Metro.start(n=>{const x=$('#repcount');if(x)x.textContent=n;}); render(); }
      break; }
    case 'ratio':{
      state.tempo.ratio=+el.dataset.r; await save('tempo');
      const was=Metro.running; Metro.stop(); render();
      if(was){ Metro.start(n=>{const x=$('#repcount');if(x)x.textContent=n;}); render(); }
      break; }

    case 'camstep':
    case 'camjump': camSeek(cam.t+(+el.dataset.n)/cam.fileFps); break;
    case 'camgo': cam.step=+el.dataset.s; render(); break;
    case 'camstep2': cam.step=2; render(); break;
    case 'setupnext': cam.setup=clamp((cam.setup||0)+1,0,SETUP.length-1); render(); break;
    case 'setupback': cam.setup=clamp((cam.setup||0)-1,0,SETUP.length-1); render(); break;
    case 'setupgo': cam.setup=+el.dataset.i; render(); break;
    case 'camstep3':
      if(!cam.url){ toast('Load a video first'); break; }
      cam.step=3; cam.mode='ref'; render(); break;
    case 'camstep4':
      if(!pxPerIn()){ toast('Tap both ends of the tape first'); break; }
      cam.step=4; cam.mode='A';
      if(!state.profile.rig){ state.profile.rig=todayKey(); await save('profile'); }
      render(); break;
    case 'cammode': cam.mode=el.dataset.m; render(); break;
    case 'camtarget': cam.target=el.dataset.t; render(); break;
    case 'camref':{ cam.refI=+el.dataset.i; cam.refIn=REFS[cam.refI].in; cam.refA=cam.refB=cam.refM=null; render(); break; }
    case 'camautofr': cam.autoFrames=!cam.autoFrames; syncFrames(); render(); break;
    case 'camcap':{ cam.captureFps=+el.dataset.x;
      document.querySelectorAll('[data-act="camcap"]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.x===cam.captureFps));
      const dt=$('#camdt'); if(dt) dt.textContent=(realDt()*1000).toFixed(2)+' ms'; camDraw(); break; }
    case 'camadd':{
      const r=camSpeed(); if(!r) break;
      cam.swings.push({club:r.club,ball:r.ball,measuredBall:r.measuredBall,frames:cam.frames,mode:r.mode});
      cam.A=cam.B=null; cam.mode='A'; render(); break; }
    case 'camdel': cam.swings.splice(+el.dataset.i,1); render(); break;
    case 'camsave':{
      const st=stats(cam.swings.map(x=>x.club)); if(!st) break;
      /* Only store a ball speed that was actually measured. On dry swings the
         "ball speed" is just club x an assumed smash factor, and saving it
         would turn an assumption into a data point. */
      const measured=cam.swings.every(x=>x.measuredBall);
      const sb=measured?stats(cam.swings.map(x=>x.ball)):null;
      const corrected=cam.swings.every(x=>x.mode==='projective');
      state.log.push({d:todayKey(),speed:Math.round(st.mean*10)/10,
        ball:sb?Math.round(sb.mean*10)/10:null, measuredBall:measured,
        note:`${st.n} swings, best ${mph(st.best)}, ±${mph(st.sd)}${corrected?'':' (2-pt scale)'}`});
      state.log.sort((a,b)=>a.d.localeCompare(b.d));
      if(!state.profile.baseline){ state.profile.baseline=state.log[0].speed; await save('profile'); }
      await save('log');
      cam.swings=[]; cam.A=cam.B=null; cam.step=1;
      toast('Test saved'); state.view='progress'; render(); break; }

    case 'savelog':{
      const sp=parseFloat($('#f-speed').value);
      if(!sp||sp<20||sp>160){ toast('Enter a club speed between 20 and 160'); return; }
      const ball=parseFloat($('#f-ball').value)||null;
      const note=$('#f-note').value.trim();
      state.log.push({d:todayKey(),speed:sp,ball,note});
      state.log.sort((a,b)=>a.d.localeCompare(b.d));
      if(!state.profile.baseline){ state.profile.baseline=state.log[0].speed; await save('profile'); }
      await save('log'); closeSheet(); toast('Saved'); state.view='progress'; render(); break; }
    case 'dellog':
      state.log.splice(+el.dataset.i,1); await save('log'); render(); break;

    case 'savesettings':{
      state.profile.name=$('#s-name').value.trim();
      const bv=parseFloat($('#s-base').value); state.profile.baseline=bv||null;
      state.profile.start=$('#s-start').value||null;
      await save('profile'); closeSheet(); toast('Saved'); render(); break; }
    case 'export':{
      const blob=new Blob([JSON.stringify({profile:state.profile,log:state.log,done:state.done},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob), a2=document.createElement('a');
      a2.href=url; a2.download='mach-golf-data.json'; a2.click(); URL.revokeObjectURL(url); break; }
    case 'reset':
      if(confirm('Erase all sessions, logs and settings on this device?')){
        state.profile={name:'',baseline:null,start:null,units:'mph',club:'Driver'};
        state.done={}; state.log=[]; cam.swings=[];
        await save('profile'); await save('done'); await save('log');
        closeSheet(); state.view='today'; render();
      } break;
  }
});

document.addEventListener('input',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='total'){ state.tempo.total=parseFloat(el.value); await save('tempo');
    const lbl=el.previousElementSibling; if(lbl) lbl.textContent='Full swing length — '+state.tempo.total.toFixed(2)+' s';
    const ph=Metro.phases(); const st=document.querySelectorAll('.grid3 .readout');
    if(st[0]) st[0].innerHTML=Math.round(ph.back*1000)+'<span class="unit">ms</span>';
    if(st[1]) st[1].innerHTML=Math.round(ph.down*1000)+'<span class="unit">ms</span>';
  }
  if(el.dataset.act==='gap'){ state.tempo.gap=parseFloat(el.value); await save('tempo');
    const lbl=el.previousElementSibling; if(lbl) lbl.textContent='Rest between swings — '+state.tempo.gap.toFixed(1)+' s';
  }
});

/* keep the screen usable during a session */
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&Metro.running){ Metro.stop(); render(); } });

/* ---------------- boot ---------------- */
(async()=>{
  await load();
  render();
  const splash=$('#brand-splash');
  if(splash){
    const delay=window.matchMedia('(prefers-reduced-motion: reduce)').matches?450:1450;
    setTimeout(()=>{
      splash.classList.add('is-hidden');
      setTimeout(()=>splash.remove(),500);
    },delay);
  }
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
