<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QuackDoku</title>
<meta name="description" content="A cozy duck logic puzzle with keyboard ASMR. Solve boards, furnish your pond house.">
<meta name="theme-color" content="#F1F5E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuackDoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#253029;
  --ink-soft:rgba(37,48,41,.42);
  --paper:#F1F5E8;
  --paper-2:#E4EDDD;
  --panel:#FDFDF6;
  --water:#C7E3DD;
  --gold:#F2B33D;
  --rose:#E88A9A;
  --line:3px;
  --r:16px;
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --c0:#F7CE5B; --c1:#9EDCC0; --c2:#9CC8F2; --c3:#F5A98A; --c4:#C3B0EC;
  --c5:#F2A0BE; --c6:#C3D69B; --c7:#E7CFA6; --c8:#A9BFC9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;
  font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper);
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.85), transparent 45%),
    radial-gradient(circle at 88% 92%, rgba(199,227,221,.7), transparent 50%);
}
h1,h2,h3,.display{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
/* One fixed screen: header on top, nav pinned at the bottom, and only the middle scrolls.
   The native wrapper turns page scrolling off, so nothing may rely on the page itself scrolling. */
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;
  padding:calc(4px + max(env(safe-area-inset-top), 6px)) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.topbar{display:flex;align-items:center;gap:12px;padding:2px 14px 8px;flex:none}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:38px;height:38px;flex:none}
.brand .name{font-family:"Fredoka";font-size:23px;font-weight:600;line-height:1}
.brand .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--panel);
  border:var(--line) solid var(--ink);border-radius:999px;padding:6px 13px;
  box-shadow:var(--shadow-sm);font-weight:700;font-size:14px;white-space:nowrap;
}
.chip b{font-family:"Fredoka";font-weight:600}
.iconbtn{
  width:42px;height:42px;display:grid;place-items:center;background:var(--panel);
  border:var(--line) solid var(--ink);border-radius:13px;box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease;
}
.iconbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.iconbtn.off{background:var(--paper-2);color:var(--ink-soft)}
.iconbtn svg{width:21px;height:21px}

.screen{display:none;flex-direction:column;flex:1 1 auto;min-height:0;animation:pop .28s ease;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:4px 12px 12px}
.screen.on{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- pond / puzzle ---------- */
.pondwrap{display:flex;flex-direction:column;align-items:center;gap:var(--gap,12px);margin-block:auto}
.levelcard{
  width:100%;max-width:560px;background:var(--panel);border:var(--line) solid var(--ink);
  border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;
  display:flex;align-items:center;gap:14px;
}
.levelcard .lv{font-family:"Fredoka";font-size:19px}
.levelcard .rule{font-size:12.5px;color:var(--ink-soft);line-height:1.35;max-width:34ch}
.progress{flex:1;min-width:60px;height:12px;border:var(--line) solid var(--ink);border-radius:999px;background:var(--paper-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0%;transition:width .5s cubic-bezier(.2,.9,.3,1)}

#boardwrap{position:relative}
#board{
  position:relative;display:grid;background:var(--ink);border:6px solid var(--ink);border-radius:0;
  overflow:hidden;box-shadow:6px 6px 0 rgba(37,48,41,.22);
  width:var(--board,min(92vw,min(520px,58vh)));aspect-ratio:1/1;touch-action:none;flex:none;
}
.cell{
  position:relative;border:0;padding:0;display:grid;place-items:center;
  transition:filter .12s ease;
  min-width:0;min-height:0;overflow:hidden;     /* never let contents resize the square */
}
.cell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(37,48,41,.13)}
.region-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.cell:hover{filter:brightness(1.06)}
.cell .mark{position:relative;z-index:2;width:64%;height:64%;pointer-events:none}
.cell .mark svg{width:100%;height:100%;display:block}
.cell.bad .duckart{animation:wobble .5s ease}
.cell.bad::before{
  content:"";position:absolute;inset:6%;border-radius:50%;z-index:1;
  background:rgba(232,138,154,.55);
}
.cell.hintglow::before{content:"";position:absolute;inset:8%;border-radius:50%;background:rgba(255,255,255,.9);animation:glow 1.4s ease infinite}
@keyframes glow{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.9;transform:scale(1.05)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes plop{0%{transform:scale(.2) translateY(-8px);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.pop{animation:plop .34s cubic-bezier(.2,1.2,.4,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
.cell.happy .mark{animation:bob .7s ease infinite}

.tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--panel);
  border:var(--line) solid var(--ink);border-radius:13px;padding:9px 15px;
  box-shadow:var(--shadow-sm);font-weight:700;font-size:14px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.gold{background:var(--gold)}
.btn.wide{padding:12px 22px;font-size:16px;font-family:"Fredoka";font-weight:600}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.45;pointer-events:none}

.soundstrip{
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:560px;
  background:var(--panel);border:var(--line) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:8px 10px 14px;width:100%;row-gap:16px;
}
.soundstrip .lbl{width:100%;text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:0}
.swatch{
  width:var(--sw,46px);height:var(--sw,46px);border:var(--line) solid var(--ink);border-radius:13px;
  display:grid;place-items:center;transition:transform .12s ease;position:relative;flex:none;
}
.swatch:active{transform:scale(.9)}
.swatch svg{width:70%;height:70%}
.swatch .tip{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:9.5px;padding:1px 6px;border-radius:99px;
  opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap;
}
.swatch.ring .tip{opacity:1}
.swatch.ring{animation:ping .5s ease}
@keyframes ping{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- home / room ---------- */
.homewrap{display:flex;flex-direction:column;gap:12px;flex:1}
.roomtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.roomtab{
  background:var(--panel);border:var(--line) solid var(--ink);border-radius:12px;
  padding:7px 14px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-sm);white-space:nowrap;
}
.roomtab.on{background:var(--gold)}
.roomtab.locked{opacity:.5;background:var(--paper-2)}

#stage{
  position:relative;width:100%;aspect-ratio:1000/620;border:var(--line) solid var(--ink);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);touch-action:none;user-select:none;
  background:var(--paper-2);
}
#wall{position:absolute;left:0;right:0;top:0;height:64%}
#floorEl{position:absolute;left:0;right:0;bottom:0;height:36%}
#baseboard{position:absolute;left:0;right:0;top:calc(64% - 12px);height:14px;background:var(--panel);border-top:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink)}
.item{position:absolute;transform-origin:50% 100%;cursor:grab;will-change:transform}
.item.dragging{cursor:grabbing;filter:drop-shadow(0 10px 8px rgba(37,48,41,.28))}
.item svg{display:block;width:100%;height:100%;pointer-events:none}
.item.sel::after{
  content:"";position:absolute;inset:-7px;border:3px dashed var(--ink);border-radius:12px;opacity:.65;
}
.pet{position:absolute;cursor:pointer;transform-origin:50% 100%}
.pet svg{width:100%;height:100%;display:block;pointer-events:none}
.bubble{
  position:absolute;background:var(--panel);border:var(--line) solid var(--ink);border-radius:12px;
  padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);
  box-shadow:var(--shadow-sm);pointer-events:none;animation:pop .2s ease;
}
#itemtools{
  position:absolute;display:none;gap:6px;background:var(--panel);border:var(--line) solid var(--ink);
  border-radius:12px;padding:5px;box-shadow:var(--shadow-sm);transform:translate(-50%,0);z-index:99;
}
#itemtools.on{display:flex}
#itemtools button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--paper-2);border:2px solid var(--ink)}
#itemtools button:active{background:var(--gold)}
#itemtools svg{width:15px;height:15px}

.drawer{background:var(--panel);border:var(--line) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.drawer-head{display:flex;gap:6px;padding:9px 10px;border-bottom:var(--line) solid var(--ink);background:var(--paper-2);overflow-x:auto}
.tabbtn{padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px;border:2px solid transparent;white-space:nowrap}
.tabbtn.on{background:var(--panel);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.tray{display:flex;gap:9px;flex-wrap:wrap;padding:12px;max-height:210px;overflow-y:auto}
.slot{
  position:relative;width:76px;height:76px;border:2px solid var(--ink);border-radius:13px;background:var(--paper);
  display:grid;place-items:center;cursor:grab;transition:transform .12s ease;
}
.slot:hover{transform:translateY(-3px)}
.slot svg{width:72%;height:72%;pointer-events:none}
.slot .count{
  position:absolute;right:-5px;top:-6px;background:var(--ink);color:var(--paper);
  font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px;
}
.slot .nm{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:9px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.swatchbig{width:74px;height:56px;border:2px solid var(--ink);border-radius:12px;position:relative;overflow:hidden;cursor:pointer}
.swatchbig.on{box-shadow:0 0 0 3px var(--gold)}
.swatchbig.locked{filter:grayscale(1) brightness(.92);cursor:not-allowed}
.swatchbig .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(37,48,41,.45);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:4px}
.empty{padding:22px 14px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.5}

/* ---------- talking to a duck ---------- */
.chat{
  background:var(--panel);border:var(--line) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;animation:pop .22s ease;
}
.chat-top{display:flex;gap:11px;align-items:flex-start;padding:12px 12px 10px;border-bottom:var(--line) solid var(--ink);background:var(--paper-2)}
.chat-art{width:52px;height:52px;flex:none;background:var(--panel);border:2px solid var(--ink);border-radius:14px;display:grid;place-items:center}
.chat-art svg{width:80%;height:80%}
.chat-body{flex:1;min-width:0}
.chat-name{font-family:"Fredoka";font-size:16px;line-height:1.2}
.chat-line{font-size:14px;line-height:1.45;margin-top:2px;min-height:2.9em}
.chat-line::after{content:"▌";opacity:.35;margin-left:1px}
.chat-x{width:30px;height:30px;flex:none;border:2px solid var(--ink);border-radius:9px;background:var(--paper);font-size:17px;line-height:1;display:grid;place-items:center}
.chat-opts{display:flex;flex-direction:column;gap:7px;padding:11px}
.chat-opt{
  text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:12px;
  padding:9px 13px;font-size:13.5px;font-weight:700;box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s ease, box-shadow .1s ease, background .1s ease;
}
.chat-opt:hover{background:var(--gold)}
.chat-opt:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
#screen-home.chatting .drawer{display:none}

/* ---------- tabs ---------- */
.tabs{
  position:relative;align-self:center;flex:none;margin:6px auto max(8px, env(safe-area-inset-bottom));z-index:60;
  display:flex;gap:6px;background:var(--panel);border:var(--line) solid var(--ink);
  border-radius:999px;padding:6px;box-shadow:var(--shadow);
}
.tabs button{padding:8px 22px;border-radius:999px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
.tabs button.on{background:var(--gold)}
.tabs button.lock{opacity:.5}
.tabs svg{width:18px;height:18px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(37,48,41,.42);display:none;place-items:center;z-index:200;padding:max(18px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom)) 18px;backdrop-filter:blur(2px)}
.veil.on{display:grid}
.modal{
  background:var(--panel);border:var(--line) solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:22px;max-width:420px;width:100%;text-align:center;animation:rise .3s cubic-bezier(.2,1.1,.4,1);
  max-height:86dvh;overflow-y:auto;
}
@keyframes rise{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:25px;margin-bottom:4px}
.modal p{font-size:14px;color:var(--ink-soft);margin:0 0 14px;line-height:1.5}
.rewards{display:flex;flex-direction:column;gap:10px;margin:4px 0 16px}
.reward{
  display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);
  border:2px solid var(--ink);border-radius:14px;padding:10px 12px;
}
.reward .art{width:54px;height:54px;flex:none;display:grid;place-items:center}
.reward .art svg{width:100%;height:100%}
.reward .t{font-family:"Fredoka";font-size:15px}
.reward .d{font-size:12px;color:var(--ink-soft)}
.modal .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.togglerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed rgba(37,48,41,.2);text-align:left}
.togglerow:last-of-type{border-bottom:none}
.togglerow .t{font-weight:700;font-size:14px}
.togglerow .d{font-size:11.5px;color:var(--ink-soft)}
.tg{width:52px;height:29px;border:var(--line) solid var(--ink);border-radius:99px;background:var(--paper-2);position:relative;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:left .16s ease}
.tg.on{background:var(--gold)}
.tg.on i{left:26px}

#feathers{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.feather{position:absolute;width:15px;height:15px;border-radius:60% 10% 60% 10%;opacity:.95}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:180;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;
  font-size:13.5px;font-weight:700;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}

/* hearts, score, points */
.levelcard{flex-direction:column;align-items:stretch;gap:9px}
.lvrow{display:flex;align-items:center;gap:12px}
.hearts{display:flex;gap:3px;margin-top:4px}
.hearts svg{width:19px;height:19px;display:block}
.hearts svg.gone{opacity:.4}
.hearts.shake{animation:shake .42s ease}
.scorebox{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.scorebox b{font-family:"Fredoka";font-weight:600;font-size:21px}
.scorebox span{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.pts{
  position:absolute;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
  font-family:"Fredoka";font-weight:600;font-size:19px;color:var(--ink);
  text-shadow:0 2px 0 rgba(255,255,255,.9);animation:riseaway .95s cubic-bezier(.2,.8,.3,1) forwards;
}
.pts.bad{color:#C4576A;font-size:16px}
@keyframes riseaway{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cell.shake{animation:shake .42s ease}
.cell.given::before{content:"";position:absolute;inset:9%;border-radius:50%;background:rgba(255,255,255,.75);z-index:1}
.scoreline{display:flex;gap:8px;margin:2px 0 14px}
.scoreline div{flex:1;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 6px}
.scoreline b{display:block;font-family:"Fredoka";font-weight:600;font-size:18px}
.scoreline span{font-size:10.5px;color:var(--ink-soft)}
.howto{display:flex;flex-direction:column;gap:11px;text-align:left;margin:6px 0 16px}
.howrow{display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.45}
.howart{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:12px}
.howart svg{width:78%;height:78%}

@media (max-width:720px){
  .levelcard{flex-wrap:wrap;gap:9px;padding:11px 13px}
  .levelcard .rule{max-width:100%;order:3;width:100%}
  .brand .sub{display:none}
  .slot{width:66px;height:66px}
  .screen{padding:4px 10px 10px}
  .topbar{padding:2px 12px 6px}
  .levelcard{padding:10px 13px;gap:7px}
  .levelcard .rule{font-size:12px;line-height:1.3}
  /* four tools on one row: icon over label */
  .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%;max-width:560px}
  .tools .btn{flex-direction:column;justify-content:center;gap:3px;padding:6px 4px;font-size:12.5px;min-width:0;white-space:nowrap}
  .tools .btn svg{width:18px;height:18px}
}
/* once the player knows the rules (past level 3), phones drop the helper text to give the board room */
@media (max-width:720px){ #app.veteran .levelcard .rule{display:none} }
#app.tight .levelcard .rule{display:none}
#app.tight .soundstrip .lbl{display:none}
#app.tight .soundstrip{padding-top:11px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
/* ---------- welcome / title screen ---------- */
body.at-title #app>.topbar,body.at-title #app>.tabs{display:none}
body.at-title #app{padding:0;max-width:none}
body.at-title #screen-title{padding:calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
body.at-title #screen-pond,body.at-title #screen-home{display:none!important}
#screen-title{display:none;flex:1 1 auto;min-height:0;align-items:center;justify-content:center;padding:calc(25px + env(safe-area-inset-top)) 18px calc(25px + env(safe-area-inset-bottom));overflow:auto}
body.at-title #screen-title{display:flex}
.title-card{position:relative;isolation:isolate;width:min(100%,480px);padding:35px 22px 28px;text-align:center;background:var(--panel);border:var(--line) solid var(--ink);border-radius:30px;box-shadow:7px 7px 0 var(--ink)}
.title-label{display:inline-block;border:2px solid var(--ink);border-radius:100px;background:var(--paper-2);padding:6px 15px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.title-name{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:clamp(44px,11vw,68px);letter-spacing:-.065em;line-height:1.08;margin:18px 0 5px;color:var(--ink);text-shadow:3px 3px 0 var(--water)}
.title-subtitle{font-size:15px;font-weight:700;color:var(--ink-soft);margin:0 0 16px}
.title-ducks{display:flex;align-items:end;justify-content:center;min-height:134px;gap:0;margin:3px 0 19px}
.title-duck{width:32%;max-width:120px;filter:drop-shadow(0 5px 0 rgba(37,48,41,.1));animation:titleFloat 3s ease-in-out infinite}
.title-duck svg{display:block;width:100%;height:auto}
.title-duck:nth-child(1){transform:rotate(-9deg);animation-delay:-.45s}
.title-duck:nth-child(2){width:38%;max-width:145px;z-index:1;animation-delay:-1.1s}
.title-duck:nth-child(3){transform:rotate(9deg);animation-delay:-1.8s}
@keyframes titleFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
.title-wave{height:16px;margin:0 auto 20px;width:80%;background:repeating-radial-gradient(ellipse at 50% -12px, transparent 0 13px,var(--water) 14px 17px,transparent 18px 32px);opacity:.9}
.title-actions{max-width:290px;margin:auto;display:flex;flex-direction:column;gap:13px}
.title-actions .btn{width:100%;min-height:54px;justify-content:center;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:20px}
.title-actions .btn:not(.gold){background:var(--paper-2)}
.title-foot{font-size:12px;color:var(--ink-soft);margin-top:22px;font-weight:700}
@media(max-height:660px){.title-card{padding:17px 20px}.title-ducks{min-height:85px;margin:0 0 6px}.title-duck{max-width:85px}.title-duck:nth-child(2){max-width:105px}.title-name{margin:7px 0 2px}.title-foot{margin-top:11px}.title-wave{margin-bottom:12px}}
</style>
</head>
<body>
<div id="app">

<script>

/* ============================================================
   QuackDoku — a cozy duck logic puzzle + a house you decorate
   ============================================================ */
"use strict";

/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- sticker art wrapper (flat fills, heavy ink outline) ---------- */
const INK = "#253029";
function sticker(vb, body, sw) {
  return '<svg viewBox="' + vb + '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<g stroke="' + INK + '" stroke-width="' + (sw || 6) + '" stroke-linejoin="round" stroke-linecap="round">' +
    body + '</g></svg>';
}

/* A chibi duck, sitting. Flat sticker fills, heavy ink outline. */
function duckArt(hex, opts) {
  opts = opts || {};
  const bill = opts.bill || "#F2B33D";
  return '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<g stroke="' + INK + '" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' +
      '<path d="M22 62L6 50c-2 12 2 22 10 28z" fill="' + hex + '"/>' +
      '<path d="M16 68c0-19 15-31 34-31s32 13 32 30c0 8-5 12-14 12H29c-9 0-13-4-13-11z" fill="' + hex + '"/>' +
      '<path d="M38 58c12-4 22 0 27 8" stroke="rgba(37,48,41,.32)" stroke-width="5" fill="none"/>' +
      '<path d="M74 27h16a7 7 0 0 1 0 14H74z" fill="' + bill + '"/>' +
      '<circle cx="62" cy="30" r="19" fill="' + hex + '"/>' +
      (opts.extra || '') +
    '</g>' +
    '<circle cx="68" cy="26" r="3.6" fill="' + INK + '"/>' +
    (opts.blush === false ? '' : '<circle cx="54" cy="36" r="5" fill="rgba(232,138,154,.5)"/>') +
    '</svg>';
}

/* squares use a pale wash of the colour so the duck on top still reads */
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const mix = v => Math.round(v + (255 - v) * amt).toString(16).padStart(2, "0");
  return "#" + mix((n >> 16) & 255) + mix((n >> 8) & 255) + mix(n & 255);
}

/* the little X you stamp on a square you've ruled out */
const xMark = sticker("0 0 100 100",

/* how many of a thing you have, in the drawer and in every room */
function ownedCount(id) {
  let k = S.inv[id] || 0;
  Object.keys(S.rooms).forEach(rid => (S.rooms[rid].items || []).forEach(it => { if (it.id === id) k++; }));
  return k;
}

/* Once a duck lives with you, half the levels bring something for it
   instead of another lamp. */
function rewardItemFor(level) {
  if (S.pets.length && level % 2 === 0) {
    const missing = PET_ITEMS.filter(i => !ownedCount(i.id));
    if (missing.length) return missing[Math.floor(level / 2) % missing.length];
  }
  return itemForLevel(level);
}

/* what you get for finishing level n */
function itemForLevel(n) { return ITEMS[(n * 7 + 3) % ITEMS.length]; }
function decorForLevel(n) {
  if (n % 5 !== 0) return null;
  const step = n / 5;                       // 1,2,3...
  const idx = Math.ceil(step / 2);          // 1,1,2,2,3,3...
  if (step % 2 === 1) return WALLS[idx] ? { type: "wall", d: WALLS[idx] } : null;
  return FLOORS[idx] ? { type: "floor", d: FLOORS[idx] } : null;
}
function petForLevel(n) { return (n % 20 === 0) ? PETS[n / 20 - 1] || null : null; }
function roomForLevel(n) { return ROOMS.find(r => r.at === n && r.at > 1) || null; }

/* Boards start tiny and grow. The first levels also come with a duck or two
   already sitting, so there is always somewhere obvious to begin. */
function sizeForLevel(n) {
  if (n <= 2) return 4;
  if (n <= 6) return 5;
  if (n <= 14) return 6;
  if (n <= 26) return 7;
  if (n <= 42) return 8;
  if (n <= 62) return 9;
  if (n <= 88) return 10;
  return 11;                       // eleven rows, eleven colours, eleven ducks
}

function givensForLevel(n) {
  if (n <= 3) return 2;
  if (n <= 8) return 1;
  return 0;
}

/* ============================================================
   Sound. Nine keyboards, synthesised live — no files to load.
   Every colour on the board is a different switch.
   ============================================================ */
const Audio_ = (() => {
  let ctx = null, master = null, verb = null, verbGain = null, dry = null;
  let ambienceNodes = null, musicTimer = null;
  let ready = false;
  const st = { sfx: true, ambience: true, music: true };

  function noiseBuffer(sec, kind) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      else if (kind === "pink") { last = 0.96 * last + 0.04 * w; d[i] = (w * 0.5 + last * 1.6) * 0.8; }
      else d[i] = w;
    }
    return buf;
  }

  function impulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function init() {
    if (ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -13; comp.knee.value = 22; comp.ratio.value = 3.6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    verb = ctx.createConvolver(); verb.buffer = impulse(1.6, 3.2);   // a small quiet desk room
    verbGain = ctx.createGain(); verbGain.gain.value = 0.2;
    dry = ctx.createGain(); dry.gain.value = 0.95;
    dry.connect(master); verb.connect(verbGain); verbGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    ready = true;
    if (st.ambience) startAmbience();
    if (st.music) startMusic();
  }

  function resume() { if (ctx && ctx.state === "suspended") ctx.resume(); }
  const t = () => ctx.currentTime;
  function out(node, wet) {
    node.connect(dry);
    const g = ctx.createGain(); g.gain.value = wet == null ? 0.2 : wet;
    node.connect(g); g.connect(verb);
  }
  function env(g, at, peak, hold, rel, start) {
    const s = start || t();
    g.gain.cancelScheduledValues(s);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(peak, s + at);
    g.gain.setValueAtTime(peak, s + at + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, s + at + hold + rel);
  }
  function noise(kind, dur) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(Math.max(dur, 0.1), kind || "white");
    return src;
  }

  /* One keystroke on a properly built board: the case thocks, the switch
     clicks on the way down, and the keycap clacks quietly again on the way
     back up. Nothing is ever exactly the same twice, because fingers. */
  function press(when, v, cfg) {
    const drift = 1 + (Math.random() - 0.5) * 0.05;        // no two presses identical
    const vv = v * (0.9 + Math.random() * 0.2);

    // case resonance — the thock. Foam-filled, so it dies quickly.
    const bg = ctx.createGain(), o = ctx.createOscillator(), lp = ctx.createBiquadFilter();
    o.type = "triangle";
    o.frequency.setValueAtTime(cfg.body * 1.9 * drift, when);
    o.frequency.exponentialRampToValueAtTime(cfg.body * drift, when + 0.016);
    lp.type = "lowpass"; lp.frequency.value = cfg.body * 6.5;
    o.connect(lp); lp.connect(bg);
    env(bg, 0.0012, cfg.bodyGain * vv, 0.003, cfg.bodyDecay, when);
    out(bg, cfg.wet);
    o.start(when); o.stop(when + cfg.bodyDecay + 0.15);

    // downstroke click, rolled off on top so it never sounds thin or rattly
    const cg = ctx.createGain(), bp = ctx.createBiquadFilter(), tp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = cfg.click * drift; bp.Q.value = cfg.q || 1.3;
    tp.type = "lowpass"; tp.frequency.value = cfg.top || 5000;
    const n = noise(cfg.grain || "white", 0.09);
    n.connect(bp); bp.connect(tp); tp.connect(cg);
    env(cg, 0.0008, cfg.clickGain * vv, 0.0012, cfg.clickDecay, when);
    out(cg, cfg.wet);
    n.start(when); n.stop(when + 0.14);

    // top-out: the cap coming back up. Quieter, higher, a hair later.
    const up = when + (cfg.up || 0.075) * (0.88 + Math.random() * 0.24);
    const ug = ctx.createGain(), ub = ctx.createBiquadFilter(), ut = ctx.createBiquadFilter();
    ub.type = "bandpass"; ub.frequency.value = cfg.click * 1.32 * drift; ub.Q.value = (cfg.q || 1.3) * 1.2;
    ut.type = "lowpass"; ut.frequency.value = (cfg.top || 5000) * 1.1;
    const un = noise("white", 0.05);
    un.connect(ub); ub.connect(ut); ut.connect(ug);
    env(ug, 0.0006, cfg.clickGain * vv * 0.3, 0.001, cfg.clickDecay * 0.7, up);
    out(ug, cfg.wet * 0.8);
    un.start(up); un.stop(up + 0.09);

    // a little of the case answers the top-out too
    const tg = ctx.createGain(), to = ctx.createOscillator();
    to.type = "sine"; to.frequency.value = cfg.body * 1.5 * drift;
    to.connect(tg);
    env(tg, 0.001, cfg.bodyGain * vv * 0.16, 0.001, cfg.bodyDecay * 0.5, up);
    out(tg, cfg.wet);
    to.start(up); to.stop(up + cfg.bodyDecay + 0.1);

    if (cfg.ping) {
      const pg = ctx.createGain(), po = ctx.createOscillator();
      po.type = "sine";
      po.frequency.setValueAtTime(cfg.ping * drift, when + 0.004);
      po.frequency.exponentialRampToValueAtTime(cfg.ping * 0.72, when + 0.004 + cfg.pingDecay);
      env(pg, 0.001, cfg.pingGain * vv, 0, cfg.pingDecay, when + 0.004);
      po.connect(pg); out(pg, 0.45);
      po.start(when + 0.004); po.stop(when + cfg.pingDecay + 0.2);
    }
  }

  /* Eleven switches. Low fundamentals, soft tops, short tails — the palette
     of an expensive gasket-mounted board on a desk mat, not a beige office
     keyboard. `body` is the case in Hz, `click` the transient, `top` the
     roll-off, `up` how long until the cap comes back. */
  const KEYS = {
    thock:   { body: 102, bodyGain: 0.58, bodyDecay: 0.095, click: 780,  q: 1.0, clickGain: 0.20, clickDecay: 0.026, top: 4200, up: 0.080, wet: 0.12 },
    clicky:  { body: 196, bodyGain: 0.30, bodyDecay: 0.050, click: 2900, q: 2.4, clickGain: 0.34, clickDecay: 0.022, top: 7000, up: 0.062, wet: 0.18, ping: 4200, pingGain: 0.055, pingDecay: 0.07 },
    tactile: { body: 150, bodyGain: 0.44, bodyDecay: 0.075, click: 1350, q: 1.5, clickGain: 0.24, clickDecay: 0.028, top: 5200, up: 0.070, wet: 0.14 },
    creamy:  { body: 128, bodyGain: 0.50, bodyDecay: 0.105, click: 640,  q: 0.85, clickGain: 0.14, clickDecay: 0.040, top: 3600, up: 0.085, wet: 0.10, grain: "pink" },
    space:   { body: 72,  bodyGain: 0.66, bodyDecay: 0.160, click: 430,  q: 0.8, clickGain: 0.18, clickDecay: 0.055, top: 2800, up: 0.105, wet: 0.20 },
    type:    { body: 250, bodyGain: 0.26, bodyDecay: 0.045, click: 4200, q: 3.0, clickGain: 0.30, clickDecay: 0.035, top: 9000, up: 0.070, wet: 0.28, ping: 5200, pingGain: 0.04, pingDecay: 0.10 },
    laptop:  { body: 300, bodyGain: 0.20, bodyDecay: 0.030, click: 2400, q: 1.7, clickGain: 0.18, clickDecay: 0.014, top: 6000, up: 0.050, wet: 0.08 },
    silent:  { body: 96,  bodyGain: 0.36, bodyDecay: 0.060, click: 500,  q: 0.7, clickGain: 0.08, clickDecay: 0.018, top: 2400, up: 0.090, wet: 0.07, grain: "pink" },
    ping:    { body: 178, bodyGain: 0.34, bodyDecay: 0.080, click: 1700, q: 1.3, clickGain: 0.20, clickDecay: 0.024, top: 6400, up: 0.075, wet: 0.20, ping: 5800, pingGain: 0.07, pingDecay: 0.22 },
    poly:    { body: 118, bodyGain: 0.52, bodyDecay: 0.088, click: 900,  q: 1.1, clickGain: 0.18, clickDecay: 0.030, top: 4000, up: 0.080, wet: 0.13 },
    gasket:  { body: 140, bodyGain: 0.48, bodyDecay: 0.100, click: 1150, q: 1.2, clickGain: 0.20, clickDecay: 0.032, top: 4600, up: 0.085, wet: 0.15 }
  };

  const voices = {};
  Object.keys(KEYS).forEach(k => {
    voices[k] = (v, when) => {
      press(when, v, KEYS[k]);
      if (k === "type") press(when + 0.052, v * 0.5, KEYS.type);   // the carriage answering back
    };
  });

  // Original synthesized ASMR textures: no recordings or network needed.
  function texture(when, v, kind, hz, dur, gain, attack = 0.008, q = 0.8) {
    const src = noise(kind, dur + 0.05), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = "bandpass"; f.frequency.value = hz; f.Q.value = q;
    src.connect(f); f.connect(g);
    env(g, attack, gain * v, dur * 0.12, dur * 0.8, when);
    out(g, 0.035); src.start(when); src.stop(when + dur + attack + 0.08);
  }
  function tone(when, v, hz, end, dur, gain, type = "sine") {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(hz, when);
    o.frequency.exponentialRampToValueAtTime(end, when + dur);
    o.connect(g); env(g, 0.003, gain * v, 0, dur, when); out(g, 0.07);
    o.start(when); o.stop(when + dur + 0.03);
  }
  voices.clicky = (v,w) => { texture(w,v,"white",3300,.035,.65); texture(w+.075,v,"white",4600,.025,.38); };
  voices.tactile = (v,w) => { [0,.11,.23].forEach((d,i)=>{tone(w+d,v,650,410,.055,.28/(1+i*.2),"triangle");texture(w+d,v,"pink",1800,.035,.24);}); };
  voices.creamy = (v,w) => texture(w,v,"pink",2600,.45,.5,.07,.55);
  voices.space = (v,w) => { tone(w,v,380,95,.12,.48); tone(w+.12,v,650,170,.085,.26); };
  voices.type = (v,w) => { [0,.045,.12,.18,.27,.32].forEach((d,i)=>texture(w+d,v,"white",1800+i*430,.045,.32,.003,1.4)); };
  voices.laptop = (v,w) => { [0,.09,.19].forEach(d=>texture(w+d,v,"white",4200,.075,.32,.012,2.5)); };
  voices.silent = (v,w) => { texture(w,v,"pink",650,.55,.64,.1,.6); texture(w+.18,v,"pink",1000,.26,.25,.06); };
  voices.ping = (v,w) => { tone(w,v,1450,1450,.45,.22);tone(w,v,2310,2310,.23,.07); };
  voices.poly = (v,w) => { tone(w,v,680,1500,.095,.33);tone(w+.18,v,900,1900,.08,.18); };
  voices.gasket = (v,w) => { tone(w,v,260,105,.065,.48,"triangle");texture(w,v,"pink",850,.065,.32,.002,2); };

  /* --- ducks do not quack here, they type. This is the big soft Enter key
         that lands underneath a duck as it sits down. --- */
  const ENTER = { body: 88, bodyGain: 0.56, bodyDecay: 0.150, click: 560, q: 0.9, clickGain: 0.22, clickDecay: 0.048, top: 3200, up: 0.10, wet: 0.22 };
  function enterKey(v, when) { press(when || t(), v == null ? 1 : v, ENTER); }

  /* a short run of typing — what a duck "says" when you tap it */
  function chatter(v, when) {
    let at = when || t();
    const k = pick(Object.keys(KEYS));
    const run = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < run; i++) { voices[k]((v == null ? 1 : v) * 0.75, at); at += rnd(0.07, 0.15); }
    enterKey((v == null ? 1 : v) * 0.7, at + 0.06);
  }

  function wrong() {                      // the backspace you did not want to press
    if (!ready || !st.sfx) return;
    const when = t();
    press(when, 0.9, { body: 90, bodyGain: 0.5, bodyDecay: 0.12, click: 380, q: 0.9, clickGain: 0.2, clickDecay: 0.05, wet: 0.2 });
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(220, when + 0.02);
    o.frequency.exponentialRampToValueAtTime(120, when + 0.3);
    env(g, 0.008, 0.16, 0.02, 0.28, when + 0.02);
    o.connect(g); out(g, 0.3); o.start(when + 0.02); o.stop(when + 0.5);
  }

  function nope() {
    if (!ready || !st.sfx) return;
    press(t(), 0.45, { body: 120, bodyGain: 0.3, bodyDecay: 0.05, click: 500, q: 1, clickGain: 0.1, clickDecay: 0.02, wet: 0.1 });
  }

  function sparkle() {
    if (!ready || !st.sfx) return;
    const base = t();
    [0, 0.06, 0.12].forEach((d, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = 900 * Math.pow(1.26, i);
      env(g, 0.004, 0.12, 0.01, 0.4, base + d);
      o.connect(g); out(g, 0.6); o.start(base + d); o.stop(base + d + 0.6);
    });
  }

  function fanfare() {
    if (!ready) return;
    const base = t();
    [0, 4, 7, 11, 14].forEach((semi, i) => {
      const when = base + i * 0.11;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = 392 * Math.pow(2, semi / 12);
      env(g, 0.01, 0.18, 0.03, 1.2, when);
      o.connect(g); out(g, 0.7); o.start(when); o.stop(when + 1.5);
    });
    chatter(0.75, base + 0.5);
  }

  /* --- just someone typing quietly in the next room. No air, no wind. --- */
  function startAmbience() {
    if (!ready || ambienceNodes) return;
    const typing = setInterval(() => {
      if (!st.ambience || !ready) return;
      if (Math.random() < 0.5) {
        const k = pick(Object.keys(KEYS));
        let when = t() + Math.random() * 0.8;
        const burst = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < burst; i++) { voices[k](0.075, when); when += rnd(0.1, 0.24); }
      }
    }, 7000);
    ambienceNodes = { typing };
  }
  function stopAmbience() {
    if (!ambienceNodes) return;
    clearInterval(ambienceNodes.typing);
    ambienceNodes = null;
  }

  /* ------------------------------------------------------------
     Lo-fi loop: electric piano, brushed drums, a round bass and
     vinyl crackle, everything a little off the grid and a little
     out of tune on purpose. 72bpm, four bars, round and round.
     ------------------------------------------------------------ */
  const BPM = 72, BEAT = 60 / BPM, BAR = BEAT * 4;
  const SWING = BEAT * 0.14;                        // offbeats lay back a touch
  const PROG = [
    { bass: -24, keys: [0, 4, 7, 14] },             // C add9
    { bass: -15, keys: [-3, 0, 4, 7] },             // Am7
    { bass: -19, keys: [5, 9, 12, 19] },            // F add9
    { bass: -17, keys: [-5, -1, 2, 7] }             // G
  ];
  let wow = null, barAt = 0, barNo = 0;

  const hz = semi => 261.63 * Math.pow(2, semi / 12);

  function ensureWow() {                            // tape wobble, the reason lo-fi sounds like tape
    if (wow) return;
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.type = "sine"; lfo.frequency.value = 0.23;
    lg.gain.value = 7;                              // cents
    lfo.connect(lg); lfo.start();
    wow = lg;
  }

  function ep(semi, when, vol, dur) {               // electric piano, felt and dusty
    const g = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(2300, when);
    lp.frequency.exponentialRampToValueAtTime(620, when + dur);
    lp.connect(g);
    [[1, 1, "sine"], [1.004, 0.45, "triangle"], [2.01, 0.14, "sine"]].forEach(m => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = m[2]; o.frequency.value = hz(semi) * m[0];
      og.gain.value = m[1];
      if (wow) wow.connect(o.detune);
      o.connect(og); og.connect(lp);
      o.start(when); o.stop(when + dur + 0.4);
    });
    env(g, 0.025, vol, 0.06, dur, when);
    out(g, 0.26);
  }

  function bassNote(semi, when, vol, dur) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = "sine"; o.frequency.value = hz(semi);
    lp.type = "lowpass"; lp.frequency.value = 320;
    if (wow) wow.connect(o.detune);
    o.connect(lp); lp.connect(g);
    env(g, 0.03, vol, 0.08, dur, when);
    out(g, 0.06);                                   // bass stays dry
    o.start(when); o.stop(when + dur + 0.3);
  }

  function kick(when, v) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(115, when);
    o.frequency.exponentialRampToValueAtTime(44, when + 0.11);
    env(g, 0.002, 0.1 * v, 0.01, 0.19, when);
    o.connect(g); out(g, 0.08);
    o.start(when); o.stop(when + 0.4);
  }

  function brush(when, v) {                         // brushed, never a crack
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 0.7;
    const n = noise("pink", 0.24); n.connect(f); f.connect(g);
    env(g, 0.012, 0.048 * v, 0.01, 0.15, when);
    out(g, 0.3); n.start(when); n.stop(when + 0.3);
  }

  function hat(when, v) {
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = 7200;
    const n = noise("white", 0.07); n.connect(f); f.connect(g);
    env(g, 0.001, 0.02 * v, 0, 0.035, when);
    out(g, 0.12); n.start(when); n.stop(when + 0.1);
  }

  function crackle(when) {                          // dust on the record
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = 1400;
    const n = noise("white", 0.02); n.connect(f); f.connect(g);
    env(g, 0.0006, rnd(0.012, 0.045), 0, 0.012, when);
    out(g, 0.1); n.start(when); n.stop(when + 0.05);
  }

  function scheduleBar(when, idx) {
    const p = PROG[idx % PROG.length];

    p.keys.forEach((semi, i) => ep(semi, when + i * 0.022, 0.033, 1.9));            // rolled chord on the one
    p.keys.forEach((semi, i) => ep(semi, when + BEAT * 2.5 + SWING + i * 0.02, 0.018, 1.3));

    bassNote(p.bass, when, 0.075, 1.2);
    bassNote(p.bass + 12, when + BEAT * 2.5 + SWING, 0.038, 0.6);

    kick(when, 1);
    kick(when + BEAT * 2.5 + SWING, 0.72);
    brush(when + BEAT * 2, 1);
    if (idx % 4 === 3) brush(when + BEAT * 3.5 + SWING, 0.6);

    for (let i = 0; i < 8; i++) hat(when + i * (BEAT / 2) + (i % 2 ? SWING : 0), i % 2 ? 0.55 : 1);

    const pops = 6 + Math.floor(Math.random() * 8);
    for (let i = 0; i < pops; i++) crackle(when + Math.random() * BAR);
  }

  function startMusic() {
    if (!ready || musicTimer) return;
    ensureWow();
    barAt = ctx.currentTime + 0.25;
    barNo = 0;
    const tick = () => {
      if (st.music) scheduleBar(barAt, barNo++);
      barAt += BAR;
      if (barAt < ctx.currentTime + 0.1) barAt = ctx.currentTime + 0.25;   // resync if the tab slept
      musicTimer = setTimeout(tick, BAR * 1000 - 180);
    };
    tick();
  }
  function stopMusic() { clearTimeout(musicTimer); musicTimer = null; }

  return {
    init, resume,
    get state() { return st; },
    set(key, val) {
      st[key] = val;
      if (!ready) return;
      if (key === "ambience") val ? startAmbience() : stopAmbience();
      if (key === "music") val ? startMusic() : stopMusic();
    },
    /* a colour's keyboard. soft = the quieter tap used for X marks */
    duck(i, soft) {
      if (!ready || !st.sfx) return;
      resume();
      const d = DUCKS[i % DUCKS.length];
      voices[d.sound](soft ? 0.5 : 1.05, t() + 0.001);
      // No shared Enter layer: preserve each duck's distinct texture.
    },
    key(i, v) { if (ready && st.sfx) { resume(); voices[DUCKS[i % DUCKS.length].sound](v == null ? 1 : v, t() + 0.001); } },
    chatter(v) { if (ready && st.sfx) { resume(); chatter(v == null ? 1 : v); } },
    enter(v) { if (ready && st.sfx) { resume(); enterKey(v); } },
    wrong, nope, sparkle, fanfare,
    tap() { if (ready && st.sfx) { resume(); press(t(), 0.5, KEYS.laptop); } }
  };
})();

/* ============================================================
   State + saving
   ============================================================ */
const SAVE_KEY = "quackdoku:v2";
const memFallback = {};
const Store = {
  async get(k) {
    try {
      if (window.storage) {
        const r = await window.storage.get(k, false);
        if (r && r.value) return JSON.parse(r.value);
      }
    } catch (e) { /* fall through */ }
    try {
      const raw = window.localStorage.getItem(k);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* fall through */ }
    return memFallback[k] || null;
  },
  async set(k, v) {
    const json = JSON.stringify(v);
    memFallback[k] = v;
    try { if (window.storage) { await window.storage.set(k, json, false); return; } } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(k, json); } catch (e) { /* memory only */ }
  }
};

function freshRoom(def) { return { wall: def.wall, floor: def.floor, items: [] }; }

function newState() {
  return {
    level: 1,
    solvedTotal: 0,
    score: 0,
    best: 0,
    seenIntro: false,
    inv: {},
    pets: [],
    walls: ["reed"],
    floors: ["pine"],
    unlockedRooms: ["cottage"],
    currentRoom: "cottage",
    rooms: { cottage: freshRoom(ROOMS[0]) },
    puz: null,
    settings: { sfx: true, ambience: true, music: true }
  };
}
let S = newState();

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => Store.set(SAVE_KEY, S), 300);
}

/* ============================================================
   Puzzle generation — every board has exactly one answer,
   so you never have to guess.
   ============================================================ */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

function makeSolution(n) {
  const cols = [];
  function rec(r) {
    if (r === n) return true;
    for (const c of shuffle([...Array(n).keys()])) {
      if (cols.includes(c)) continue;
      if (r > 0 && Math.abs(cols[r - 1] - c) < 2) continue;
      cols.push(c);
      if (rec(r + 1)) return true;
      cols.pop();
    }
    return false;
  }
  return rec(0) ? cols : null;
}

function growRegions(n, sol) {
  const reg = Array.from({ length: n }, () => Array(n).fill(-1));
  const frontier = [];
  for (let r = 0; r < n; r++) reg[r][sol[r]] = r;
  const push = (r, c, g) => { if (r < 0 || c < 0 || r >= n || c >= n || reg[r][c] !== -1) return; frontier.push({ r, c, g }); };
  for (let r = 0; r < n; r++) { push(r - 1, sol[r], r); push(r + 1, sol[r], r); push(r, sol[r] - 1, r); push(r, sol[r] + 1, r); }
  const sizes = Array(n).fill(1);
  let guard = 0;
  while (frontier.length && guard++ < n * n * 60) {
    let idx = Math.floor(Math.random() * frontier.length);
    if (Math.random() < 0.65) {
      let best = 0, bestScore = Infinity;
      for (let i = 0; i < frontier.length; i++) {
        const s = sizes[frontier[i].g] + Math.random() * 1.8;
        if (s < bestScore) { bestScore = s; best = i; }
      }
      idx = best;
    }
    const cell = frontier.splice(idx, 1)[0];
    if (reg[cell.r][cell.c] !== -1) continue;
    reg[cell.r][cell.c] = cell.g; sizes[cell.g]++;
    push(cell.r - 1, cell.c, cell.g); push(cell.r + 1, cell.c, cell.g);
    push(cell.r, cell.c - 1, cell.g); push(cell.r, cell.c + 1, cell.g);
  }
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (reg[r][c] === -1) {
    const nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < n && b < n && reg[a][b] !== -1);
    reg[r][c] = nb.length ? reg[nb[0][0]][nb[0][1]] : 0;
  }
  return reg;
}

function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }

/* Column use, colour use and the no-touching rule all live in bitmasks, and
   a forward check drops any branch that has already stranded a colour. */
function solveBoard(n, reg, limit) {
  const FULL = (1 << n) - 1;
  const rowRegCols = [];                 // rowRegCols[r][g] = columns of colour g in row r
  for (let r = 0; r < n; r++) {
    const m = new Int32Array(n);
    for (let c = 0; c < n; c++) m[reg[r][c]] |= 1 << c;
    rowRegCols.push(m);
  }
  const out = [], row = new Int8Array(n);

  function rec(r, colMask, regMask, prev) {
    if (out.length >= limit) return;
    if (r === n) { out.push(Array.from(row)); return; }

    const need = FULL & ~regMask;
    if (need) {
      if (n - r < popcount(need)) return;
      let reachable = 0;
      for (let rr = r; rr < n; rr++) {
        const m = rowRegCols[rr];
        for (let g = 0; g < n; g++) if ((need >> g & 1) && (m[g] & ~colMask)) reachable |= 1 << g;
        if ((reachable & need) === need) break;
      }
      if ((reachable & need) !== need) return;
    }

    let free = ~colMask & FULL;
    if (prev >= 0) {
      let adj = 1 << prev;
      if (prev > 0) adj |= 1 << (prev - 1);
      if (prev < n - 1) adj |= 1 << (prev + 1);
      free &= ~adj;
    }
    while (free) {
      const bit = free & -free;
      free ^= bit;
      const c = 31 - Math.clz32(bit);
      const g = reg[r][c];
      if (regMask >> g & 1) continue;
      row[r] = c;
      rec(r + 1, colMask | bit, regMask | (1 << g), c);
      if (out.length >= limit) return;
    }
  }
  rec(0, 0, 0, -1);
  return out;
}

function regionConnected(n, reg, g, skipR, skipC) {
  const cells = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (reg[r][c] === g && !(r === skipR && c === skipC)) cells.push(r * n + c);
  if (!cells.length) return false;
  const seen = new Set([cells[0]]), st = [cells[0]];
  while (st.length) {
    const v = st.pop(), r = Math.floor(v / n), c = v % n;
    for (const [a, b] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
      if (a < 0 || b < 0 || a >= n || b >= n) continue;
      if (a === skipR && b === skipC) continue;
      if (reg[a][b] !== g) continue;
      const k = a * n + b;
      if (!seen.has(k)) { seen.add(k); st.push(k); }
    }
  }
  return seen.size === cells.length;
}

/* nudge one square into a neighbouring colour so a rival answer dies */
function repairRegions(n, reg, sol, alt) {
  const rows = shuffle([...Array(n).keys()].filter(r => alt[r] !== sol[r]));
  const altOwner = new Map();
  for (let r = 0; r < n; r++) altOwner.set(reg[r][alt[r]], r);
  for (let pass = 0; pass < 2; pass++) {
    for (const r of rows) {
      const c = alt[r], old = reg[r][c];
      const nbs = shuffle([[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < n && b < n));
      for (const [a, b] of nbs) {
        const g2 = reg[a][b];
        if (g2 === old) continue;
        if (pass === 0) {
          const owner = altOwner.get(g2);
          if (owner === undefined || owner === r) continue;
        }
        if (!regionConnected(n, reg, old, r, c)) continue;
        reg[r][c] = g2;
        return true;
      }
    }
  }
  return false;
}

/* Generation is resumable: genWork chews for a few milliseconds and hands
   back control, so a big board can be built a slice at a time while the
   player is busy thinking, instead of freezing the game. */
function genStart(n) { return { n, sol: null, reg: null, step: 0, attempts: 0 }; }

function genWork(g, budgetMs) {
  const deadline = Date.now() + budgetMs;
  do {
    if (!g.sol) {
      g.sol = makeSolution(g.n);
      if (!g.sol) { g.attempts++; continue; }
      g.reg = growRegions(g.n, g.sol);
      g.step = 0;
    }
    const sols = solveBoard(g.n, g.reg, 2);
    if (sols.length === 1) return { n: g.n, sol: g.sol, reg: g.reg };
    const alt = sols.find(s => s.some((v, i) => v !== g.sol[i]));
    if (!alt) return { n: g.n, sol: g.sol, reg: g.reg };
    if (!repairRegions(g.n, g.reg, g.sol, alt) || ++g.step > g.n * g.n * 6) { g.sol = null; g.attempts++; }
  } while (Date.now() < deadline && g.attempts < 400);
  return null;
}

function generatePuzzle(n, budgetMs) { return genWork(genStart(n), budgetMs || 600); }

/* the next level's board, quietly built in the background while you solve this one */
let prefetch = null;
function stopPrefetch() { if (prefetch && prefetch.timer) clearTimeout(prefetch.timer); prefetch = null; }
function startPrefetch(level) {
  stopPrefetch();
  const st = { level, gen: genStart(sizeForLevel(level)), result: null, timer: null };
  const tick = () => {
    st.result = genWork(st.gen, 10);        // 10ms a go, never a dropped frame
    st.timer = st.result ? null : setTimeout(tick, 70);
  };
  st.timer = setTimeout(tick, 400);
  prefetch = st;
}
function takePrefetched(level) {
  if (prefetch && prefetch.level === level && prefetch.result) {
    const r = prefetch.result;
    prefetch = null;
    return r;
  }
  return null;
}

/* ============================================================
   The board

   Rules, the same as the cat game this borrows from:
   one duck per row, one per column, one per colour, and no two
   ducks may touch — not even at a corner. Sitting a duck also
   stamps an X across its row, its column, its colour patch and
   every square it is touching, because none of those can hold
   another duck.
   ============================================================ */
const boardEl = $("#board");
let P = null;                 // { n, reg, sol, cells, given[], undo[] }
let lives = LIVES, levelScore = 0, streak = 0, failed = false, winning = false;
let painting = false;
let levelDone = false;        // true from "level cleared" until the next board is dealt

function zeros(n) { return Array.from({ length: n }, () => Array(n).fill(0)); }

function newPuzzle(level) {
  levelDone = false;
  const n = sizeForLevel(level);
  const g = takePrefetched(level)
         || generatePuzzle(n, 900)
         || generatePuzzle(Math.max(4, n - 1), 1200)
         || generatePuzzle(Math.max(4, n - 2), 2500);
  P = { n: g.n, reg: g.reg, sol: g.sol, cells: zeros(g.n), given: [], undo: [] };
  const rows = shuffle([...Array(g.n).keys()]).slice(0, givensForLevel(level));
  rows.forEach(r => { stampDuck(r, g.sol[r]); P.given.push([r, g.sol[r]]); });
  lives = LIVES; levelScore = 0; streak = 0; failed = false; winning = false;
  persist(); drawBoard();
  startPrefetch(level + 1);
}

function loadPuzzle(p) {
  levelDone = false;
  P = { n: p.n, reg: p.reg, sol: p.sol, cells: p.cells, given: p.given || [], undo: [] };
  lives = typeof p.lives === "number" ? p.lives : LIVES;
  levelScore = p.levelScore || 0;
  streak = 0; failed = false; winning = false;
  drawBoard();
  startPrefetch(S.level + 1);
}

function restartLevel() {
  P.cells = zeros(P.n);
  P.undo = [];
  P.given.forEach(([r, c]) => stampDuck(r, c));
  lives = LIVES; levelScore = 0; streak = 0; failed = false; winning = false;
  persist(); drawBoard();
}

function persist() {
  if (levelDone) return;      // a cleared board is never saved, so it cannot come back
  S.puz = { n: P.n, reg: P.reg, sol: P.sol, cells: P.cells, given: P.given, lives, levelScore };
  save();
}

/* place a duck and rule out everything it blocks */
function stampDuck(r, c) {
  const n = P.n, g = P.reg[r][c];
  for (let i = 0; i < n; i++) {
    if (P.cells[r][i] === 0) P.cells[r][i] = 1;
    if (P.cells[i][c] === 0) P.cells[i][c] = 1;
  }
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    if (P.reg[a][b] === g && P.cells[a][b] === 0) P.cells[a][b] = 1;
    if (Math.abs(a - r) <= 1 && Math.abs(b - c) <= 1 && P.cells[a][b] === 0) P.cells[a][b] = 1;
  }
  P.cells[r][c] = 2;
}

function isGiven(r, c) { return P.given.some(g => g[0] === r && g[1] === c); }

function drawBoard() {
  const n = P.n;
  boardEl.style.gridTemplateColumns = `repeat(${n},1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${n},1fr)`;    // without this, a row grows to fit its first mark
  boardEl.innerHTML = "";
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const g = P.reg[r][c];
      const b = document.createElement("button");
      b.className = "cell";
      b.style.background = DUCKS[g].pale;
      b.dataset.r = r; b.dataset.c = c;
      b.setAttribute("aria-label", `row ${r + 1}, column ${c + 1}, ${DUCKS[g].name} patch`);
      if (r === 0 || P.reg[r - 1][c] !== g) b.classList.add("eT");
      if (r === n - 1 || P.reg[r + 1][c] !== g) b.classList.add("eB");
      if (c === 0 || P.reg[r][c - 1] !== g) b.classList.add("eL");
      if (c === n - 1 || P.reg[r][c + 1] !== g) b.classList.add("eR");
      if (isGiven(r, c)) b.classList.add("given");
      b.appendChild(document.createElement("span")).className = "mark";
      boardEl.appendChild(b);
    }
  }
  // Draw each shared region edge once; square caps fill every corner cleanly.
  const edges = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (c < n - 1 && P.reg[r][c] !== P.reg[r][c+1])
      edges.push(`M${c+1} ${r}V${r+1}`);
    if (r < n - 1 && P.reg[r][c] !== P.reg[r+1][c])
      edges.push(`M${c} ${r+1}H${c+1}`);
  }
  const overlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  overlay.setAttribute("viewBox", `0 0 ${n} ${n}`);
  overlay.setAttribute("class", "region-lines");
  overlay.setAttribute("aria-hidden", "true");
  overlay.innerHTML = `<path d="${edges.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="6" vector-effect="non-scaling-stroke" stroke-linecap="square" stroke-linejoin="miter"/>`;
  boardEl.appendChild(overlay);
  paintCells();
  renderSoundStrip();
  queueFit();
}

function cellEl(r, c) { return boardEl.children[r * P.n + c]; }

function paintCells(animate) {
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++) {
    const el = cellEl(r, c), v = P.cells[r][c], m = el.firstChild;
    if (m.dataset.v !== String(v)) {
      m.innerHTML = v === 2 ? DUCK_SVG[P.reg[r][c]] : v === 1 ? xMark : "";
      m.dataset.v = String(v);
      if (v && animate) { m.classList.remove("pop"); void m.offsetWidth; m.classList.add("pop"); }
    }
  }
  updateHud();
}

function duckTotal() {
  let k = 0;
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++) if (P.cells[r][c] === 2) k++;
  return k;
}

function updateHud() {
  const k = duckTotal();
  $("#duckCount").textContent = k + "/" + P.n;
  $("#lvBar").style.width = Math.min(100, (k / P.n) * 100) + "%";
  $("#lvTitle").textContent = "Level " + S.level;
  $("#scoreNow").textContent = (S.score + levelScore).toLocaleString();
  let h = "";
  for (let i = 0; i < LIVES; i++) h += heartSVG(i < lives);
  $("#hearts").innerHTML = h;
  $("#levelchip").innerHTML = "Level <b>" + S.level + "</b>";
}

function floatPts(r, c, text, cls) {
  const wrap = $("#boardwrap");
  const a = cellEl(r, c).getBoundingClientRect(), b = wrap.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "pts" + (cls ? " " + cls : "");
  d.textContent = text;
  d.style.left = (a.left - b.left + a.width / 2) + "px";
  d.style.top = (a.top - b.top + a.height / 2) + "px";
  wrap.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

function shakeCell(r, c) {
  const el = cellEl(r, c);
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}

function snapshot() {
  P.undo.push(P.cells.map(row => row.slice()));
  if (P.undo.length > 60) P.undo.shift();
}

/* ------------------------------------------------------------
   Tapping
   first tap  = your own X, free, just a note to yourself
   second tap = sit a duck. Right, and you score. Wrong, and it
                costs a life.
   ------------------------------------------------------------ */
function tapCell(r, c, forceX) {
  if (winning || failed || levelDone) return;
  Audio_.init(); Audio_.resume();
  const g = P.reg[r][c], v = P.cells[r][c];

  if (v === 2) { Audio_.nope(); shakeCell(r, c); return; }

  if (v === 0) {
    if (!forceX) snapshot();
    P.cells[r][c] = 1;
    Audio_.duck(g, true);
    paintCells(true); persist();
    return;
  }

  if (forceX) return;                       // sweeping only ever adds X marks

  if (P.sol[r] === c) {                     // right square
    stampDuck(r, c);
    P.undo = [];
    streak = Math.min(streak + 1, 4);
    const pts = 100 + 25 * (streak - 1);
    levelScore += pts;
    Audio_.duck(g, false);
    paintCells(true);
    floatPts(r, c, "+" + pts);
    persist();
    checkWin();
  } else {                                  // wrong square
    lives--;
    streak = 0;
    Audio_.wrong();
    shakeCell(r, c);
    $("#hearts").classList.remove("shake"); void $("#hearts").offsetWidth; $("#hearts").classList.add("shake");
    floatPts(r, c, "−1 life", "bad");
    updateHud(); persist();
    if (lives <= 0) failLevel();
  }
}

function checkWin() {
  if (duckTotal() !== P.n) return;
  winning = true;
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++)
    if (P.cells[r][c] === 2) cellEl(r, c).classList.add("happy");
  Audio_.fanfare();
  featherBurst();
  setTimeout(() => { winning = false; completeLevel(); }, 1000);
}

/* board input: tap to mark, or press and drag to sweep X marks */
boardEl.addEventListener("pointerdown", e => {
  const el = e.target.closest(".cell");
  if (!el) return;
  boardEl.setPointerCapture(e.pointerId);
  painting = true;
  tapCell(+el.dataset.r, +el.dataset.c, false);
});
boardEl.addEventListener("pointermove", e => {
  if (!painting) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const cell = under && under.closest && under.closest(".cell");
  if (!cell || cell.dataset.painted === "1") return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  if (P.cells[r][c] !== 0) return;
  cell.dataset.painted = "1";
  tapCell(r, c, true);
});
window.addEventListener("pointerup", () => {
  painting = false;
  $$(".cell").forEach(c => c.dataset.painted = "0");
});

$("#btnUndo").onclick = () => {
  if (!P.undo.length) { Audio_.nope(); toast("Nothing to take back"); return; }
  P.cells = P.undo.pop();
  Audio_.tap(); paintCells(); persist();
};
$("#btnClear").onclick = () => {
  snapshot();
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++) if (P.cells[r][c] === 1) P.cells[r][c] = 0;
  P.given.forEach(([r, c]) => stampDuck(r, c));
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++) if (P.cells[r][c] === 2) stampDuck(r, c);
  Audio_.tap(); paintCells(); persist();
  toast("X marks cleared");
};
$("#btnHint").onclick = () => {
  if (winning || failed) return;
  Audio_.init();
  const spots = [];
  for (let r = 0; r < P.n; r++) if (P.cells[r][P.sol[r]] !== 2) spots.push(r);
  if (!spots.length) return;
  const r = pick(spots), c = P.sol[r];
  levelScore = Math.max(0, levelScore - HINT_COST);
  cellEl(r, c).classList.add("hintglow");
  setTimeout(() => cellEl(r, c).classList.remove("hintglow"), 2600);
  Audio_.sparkle();
  floatPts(r, c, "−" + HINT_COST, "bad");
  updateHud(); persist();
};
$("#btnRestart").onclick = () => {
  Audio_.init(); Audio_.tap();
  restartLevel();
  toast("Level reset");
};

/* ============================================================
   Little bits of chrome: toast, feathers, modal

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2000);
}

function featherBurst(count) {
  const host = $("#feathers");
  const colors = DUCKS.map(d => d.hex);
  for (let i = 0; i < (count || 26); i++) {
    const f = document.createElement("i");
    f.className = "feather";
    f.style.background = pick(colors);
    f.style.left = rnd(2, 98) + "vw";
    f.style.top = rnd(-22, -4) + "vh";
    f.style.animation = `fall ${rnd(2.6, 5.2)}s linear ${rnd(0, .8)}s forwards`;
    host.appendChild(f);
    setTimeout(() => f.remove(), 6600);
  }
}

function closeModal() {
  $("#veil").classList.remove("on");
  // However the level-cleared card is closed (Next, Go decorate, tapping outside),
  // the pond is already on the next level when you see it again.
  if (levelDone) setTimeout(() => { if (levelDone) newPuzzle(S.level); }, 0);
}
function showModal(html) {
  $("#modal").innerHTML = html;
  $("#veil").classList.add("on");
}
$("#veil").addEventListener("pointerdown", e => { if (e.target.id === "veil") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ============================================================
   Clearing a level, and running out of hearts
   ============================================================ */
function grantItem(id, n) { S.inv[id] = (S.inv[id] || 0) + (n || 1); }
function homeUnlocked() { return S.solvedTotal >= 3; }

const ROOM_ICON = sticker("0 0 100 100",
  '<path d="M14 48L50 18l36 30v38H14z" fill="#F2C99B"/><path d="M38 86V62h24v24" fill="#C98255"/>');

function failLevel() {
  failed = true;
  Audio_.wrong();
  setTimeout(() => showModal(
    '<h2>Out of hearts</h2>' +
    '<p>Three wrong ducks and the level starts over. The ' + levelScore.toLocaleString() +
    ' points from this level do not count — your ' + S.score.toLocaleString() + ' banked points are safe.</p>' +
    '<div class="row">' +
    '<button class="btn wide gold" id="fRetry">Try this board again</button>' +
    '<button class="btn wide" id="fNew">Different board</button>' +
    '</div>'
  ), 420);
  setTimeout(() => {
    const a = $("#fRetry"), b = $("#fNew");
    if (a) a.onclick = () => { closeModal(); restartLevel(); };
    if (b) b.onclick = () => { closeModal(); newPuzzle(S.level); };
  }, 440);
}

function completeLevel() {
  const done = S.level;
  const perfect = lives === LIVES;
  const bonus = 200 + lives * 100 + (perfect ? 300 : 0);
  const earned = levelScore + bonus;
  S.score += earned;
  if (S.score > S.best) S.best = S.score;

  const rewards = [];
  const item = rewardItemFor(done);
  grantItem(item.id);
  rewards.push({ art: item.art, t: item.name, d: "New thing for the house" });

  const dec = decorForLevel(done);
  if (dec) {
    const list = dec.type === "wall" ? S.walls : S.floors;
    if (!list.includes(dec.d.id)) list.push(dec.d.id);
    rewards.push({ swatch: dec.d.css, t: dec.d.name, d: dec.type === "wall" ? "Wallpaper unlocked" : "Flooring unlocked" });
  }

  const pet = petForLevel(done);
  if (pet && !S.pets.includes(pet.id)) {
    S.pets.push(pet.id);
    rewards.push({ art: duckArt(pet.hex, { blush: true }), t: pet.name + " moved in", d: "A duck who lives with you now" });
  }

  const room = roomForLevel(done);
  if (room && !S.unlockedRooms.includes(room.id)) {
    S.unlockedRooms.push(room.id);
    S.rooms[room.id] = freshRoom(room);
    rewards.push({ art: ROOM_ICON, t: room.name, d: "A whole new room to fill" });
  }

  S.level = done + 1;
  S.solvedTotal++;
  levelDone = true;
  S.puz = null;               // next launch, or next visit to the pond, deals the new level
  const justUnlockedHome = S.solvedTotal === 3;
  levelScore = 0;
  save();

  const rows = rewards.map(r => (
    '<div class="reward"><div class="art">' +
    (r.swatch ? '<span style="width:52px;height:52px;border:3px solid ' + INK + ';border-radius:10px;background:' + r.swatch + ';display:block"></span>' : r.art) +
    '</div><div><div class="t">' + r.t + '</div><div class="d">' + r.d + '</div></div></div>'
  )).join("");

  showModal(
    '<h2>Level ' + done + ' cleared</h2>' +
    '<div class="scoreline">' +
    '<div><b>' + (earned - bonus).toLocaleString() + '</b><span>ducks settled</span></div>' +
    '<div><b>+' + bonus.toLocaleString() + '</b><span>' + (perfect ? "no mistakes" : lives + " heart" + (lives === 1 ? "" : "s") + " left") + '</span></div>' +
    '<div><b>' + S.score.toLocaleString() + '</b><span>total</span></div>' +
    '</div>' +
    '<div class="rewards">' + rows + '</div>' +
    (justUnlockedHome ? '<p>Your house is open now — the Home tab at the bottom.</p>' : '') +
    '<div class="row">' +
    '<button class="btn wide gold" id="mNext">Next level</button>' +
    (homeUnlocked() ? '<button class="btn wide" id="mHome">Go decorate</button>' : '') +
    '</div>'
  );

  $("#mNext").onclick = () => { closeModal(); };
  const mh = $("#mHome");
  if (mh) mh.onclick = () => { closeModal(); goHome(); };
  renderTabs();
}
