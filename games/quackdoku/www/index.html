/* ============================================================
   The house
   ============================================================ */
const SW = 1000, SH = 620;                 // room is measured in these units
const stage = $("#stage");
const toolsEl = $("#itemtools");
let selected = null;                        // uid of the selected thing
let drag = null;                            // { uid, dx, dy }

const itemById = id => ALL_ITEMS.find(i => i.id === id);
const room = () => S.rooms[S.currentRoom];

function toStage(clientX, clientY) {
  const b = stage.getBoundingClientRect();
  return { x: ((clientX - b.left) / b.width) * SW, y: ((clientY - b.top) / b.height) * SH };
}

function defaultZ(kind) { return kind === "rug" ? 1 : kind === "wall" ? 2 : 10; }

function renderSurfaces() {
  const r = room();
  const w = WALLS.find(x => x.id === r.wall) || WALLS[0];
  const f = FLOORS.find(x => x.id === r.floor) || FLOORS[0];
  $("#wall").style.background = w.css;
  $("#floorEl").style.background = f.css;
}

function renderRoomItems() {
  $$("#stage .item").forEach(e => e.remove());
  const r = room();
  r.items.forEach(it => stage.appendChild(makeItemEl(it)));
  positionTools();
}

function makeItemEl(it) {
  const def = itemById(it.id);
  const el = document.createElement("div");
  el.className = "item" + (selected === it.uid ? " sel" : "");
  el.dataset.uid = it.uid;
  el.innerHTML = def.art;
  styleItem(el, it, def);
  return el;
}

function styleItem(el, it, def) {
  def = def || itemById(it.id);
  el.style.left = (it.x / SW) * 100 + "%";
  el.style.top = (it.y / SH) * 100 + "%";
  el.style.width = ((def.w * it.s) / SW) * 100 + "%";
  el.style.height = ((def.h * it.s) / SH) * 100 + "%";
  el.style.zIndex = it.z;
  el.style.transform = "translate(-50%,-50%) scaleX(" + (it.flip ? -1 : 1) + ")";
}

function findItem(uid) { return room().items.find(i => i.uid === uid); }

function selectItem(uid) {
  selected = uid;
  $$("#stage .item").forEach(e => e.classList.toggle("sel", e.dataset.uid === uid));
  positionTools();
}

function positionTools() {
  const it = selected && findItem(selected);
  if (!it) { toolsEl.classList.remove("on"); return; }
  const def = itemById(it.id);
  toolsEl.classList.add("on");
  toolsEl.style.left = clamp((it.x / SW) * 100, 12, 88) + "%";
  toolsEl.style.top = clamp(((it.y + (def.h * it.s) / 2 + 12) / SH) * 100, 4, 86) + "%";
}

/* --- dragging things around --- */
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".item");
  if (!el) {
    if (!e.target.closest("#itemtools")) { selected = null; selectItem(null); }
    return;
  }
  Audio_.init();
  const it = findItem(el.dataset.uid);
  const p = toStage(e.clientX, e.clientY);
  drag = { uid: it.uid, dx: p.x - it.x, dy: p.y - it.y, moved: false };
  el.classList.add("dragging");
  el.setPointerCapture(e.pointerId);
  selectItem(it.uid);
});

stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const it = findItem(drag.uid);
  if (!it) return;
  const p = toStage(e.clientX, e.clientY);
  it.x = clamp(p.x - drag.dx, 20, SW - 20);
  it.y = clamp(p.y - drag.dy, 20, SH - 20);
  drag.moved = true;
  const el = stage.querySelector('.item[data-uid="' + it.uid + '"]');
  if (el) styleItem(el, it);
  positionTools();
});

function endDrag(e) {
  if (!drag) return;
  const el = stage.querySelector('.item[data-uid="' + drag.uid + '"]');
  if (el) el.classList.remove("dragging");
  if (drag.moved) { Audio_.tap(); save(); }
  drag = null;
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* --- the little toolbar over a selected thing --- */
toolsEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !selected) return;
  const it = findItem(selected);
  if (!it) return;
  const act = b.dataset.act;
  if (act === "flip") it.flip = !it.flip;
  if (act === "bigger") it.s = clamp(it.s + 0.12, 0.5, 2.2);
  if (act === "smaller") it.s = clamp(it.s - 0.12, 0.5, 2.2);
  if (act === "front") it.z = Math.max(...room().items.map(i => i.z), 0) + 1;
  if (act === "away") {
    grantItem(it.id);
    room().items = room().items.filter(i => i.uid !== it.uid);
    selected = null;
    renderRoomItems(); renderTray(); save(); Audio_.tap();
    toast("Back in the drawer");
    return;
  }
  const el = stage.querySelector('.item[data-uid="' + it.uid + '"]');
  if (el) styleItem(el, it);
  positionTools(); Audio_.tap(); save();
});

/* --- placing something from the drawer --- */
function placeItem(id, x, y) {
  if (!S.inv[id]) return null;
  S.inv[id]--;
  if (!S.inv[id]) delete S.inv[id];
  const def = itemById(id);
  const it = {
    uid: uid(), id, s: 1, flip: false,
    x: clamp(x, 40, SW - 40),
    y: clamp(y, 40, SH - 40),
    z: defaultZ(def.kind) + room().items.length
  };
  room().items.push(it);
  stage.appendChild(makeItemEl(it));
  selectItem(it.uid);
  renderTray(); save();
  return it;
}

/* ============================================================
   Drawer
   ============================================================ */
let tab = "stuff";
$("#drawerHead").addEventListener("click", e => {
  const b = e.target.closest(".tabbtn");
  if (!b) return;
  tab = b.dataset.tab;
  $$("#drawerHead .tabbtn").forEach(x => x.classList.toggle("on", x === b));
  Audio_.tap();
  renderTray();
});

function renderTray() {
  const tray = $("#tray");
  tray.innerHTML = "";
  if (tab === "stuff") {
    const ids = Object.keys(S.inv);
    if (!ids.length) {
      tray.innerHTML = '<div class="empty">Nothing in the drawer.<br>Every level you finish sends something home.</div>';
      return;
    }
    ids.forEach(id => {
      const def = itemById(id);
      if (!def) return;
      const s = document.createElement("div");
      s.className = "slot";
      s.dataset.id = id;
      s.title = def.name;
      s.innerHTML = def.art + '<span class="count">' + S.inv[id] + '</span><span class="nm">' + def.name + '</span>';
      tray.appendChild(s);
    });
  } else if (tab === "wall" || tab === "floor") {
    const all = tab === "wall" ? WALLS : FLOORS;
    const owned = tab === "wall" ? S.walls : S.floors;
    const cur = tab === "wall" ? room().wall : room().floor;
    all.forEach((d, i) => {
      const has = owned.includes(d.id);
      const b = document.createElement("button");
      b.className = "swatchbig" + (cur === d.id ? " on" : "") + (has ? "" : " locked");
      b.style.background = d.css;
      b.title = d.name;
      if (!has) {
        const need = (tab === "wall" ? (i * 2 - 1) : (i * 2)) * 5;
        b.innerHTML = '<span class="lock">Level ' + need + '</span>';
      }
      b.onclick = () => {
        if (!has) { Audio_.nope(); toast(d.name + " is still locked"); return; }
        if (tab === "wall") room().wall = d.id; else room().floor = d.id;
        renderSurfaces(); renderTray(); save(); Audio_.duck(1, true);
      };
      tray.appendChild(b);
    });
  } else {
    PETS.forEach((p, i) => {
      const has = S.pets.includes(p.id);
      const s = document.createElement("div");
      s.className = "slot";
      s.style.cursor = has ? "pointer" : "default";
      s.innerHTML = duckArt(has ? p.hex : "#DCDCD2", { blush: has }) +
        '<span class="nm">' + (has ? p.name : "Level " + ((i + 1) * 20)) + '</span>';
      if (has) s.onclick = () => { callPet(p.id); };   // walks over and starts talking
      tray.appendChild(s);
    });
    const note = document.createElement("div");
    note.className = "empty";
    note.style.width = "100%";
    note.innerHTML = "A duck moves in every twenty levels. Tap one to call it over for a chat.";
    tray.appendChild(note);
  }
}

/* drag straight out of the drawer and into the room */
$("#tray").addEventListener("pointerdown", e => {
  const slot = e.target.closest(".slot[data-id]");
  if (!slot) return;
  Audio_.init();
  const id = slot.dataset.id;
  const b = stage.getBoundingClientRect();
  const inside = e.clientY > b.top && e.clientY < b.bottom;
  const p = inside ? toStage(e.clientX, e.clientY) : { x: SW / 2, y: SH * 0.62 };
  const it = placeItem(id, p.x, p.y);
  if (!it) return;
  Audio_.duck(2, true);
  toast(itemById(id).name + " — drag it where you like");
});

/* ============================================================
   Pets: they wander, they use their things, and they will talk
   to you for as long as you like.
   ============================================================ */
const petNodes = new Map();
let petLoop = null, chatWith = null, typeTimer = null, lastT = 0;

function petData(pid) {
  if (!S.petData) S.petData = {};
  if (!S.petData[pid]) S.petData[pid] = { chats: 0, answers: {} };
  return S.petData[pid];
}

function renderPets() {
  $$("#stage .pet").forEach(e => e.remove());
  petNodes.clear();
  S.pets.forEach(pid => {
    const p = PETS.find(x => x.id === pid);
    const el = document.createElement("div");
    el.className = "pet";
    el.dataset.pid = pid;
    el.innerHTML = duckArt(p.hex, { blush: true });
    stage.appendChild(el);
    const st = { pid, x: rnd(150, 850), y: rnd(430, 570), tx: rnd(150, 850), ty: rnd(430, 570), t: rnd(0, 4), face: 1, el, arrived: false, goal: null };
    petNodes.set(pid, st);
    el.onclick = () => openChat(pid);
  });
  if (!petLoop) petLoop = requestAnimationFrame(stepPets);
}

function bubbleAt(st, text) {
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  b.style.left = clamp((st.x / SW) * 100, 8, 92) + "%";
  b.style.top = ((st.y / SH) * 100 - 6) + "%";
  b.style.zIndex = 60;
  stage.appendChild(b);
  setTimeout(() => b.remove(), 1900);
}

function petStuffInRoom() {
  return (room().items || []).filter(it => { const d = itemById(it.id); return d && d.pet; });
}

function chooseTarget(st) {
  const stuff = petStuffInRoom();
  if (stuff.length && Math.random() < 0.6) {
    const it = pick(stuff);
    st.goal = it.id;
    st.tx = clamp(it.x, 110, 890);
    st.ty = clamp(it.y + 18, 410, 585);
  } else {
    st.goal = null;
    st.tx = rnd(120, 880);
    st.ty = rnd(415, 580);
  }
}

function stepPets(ts) {
  petLoop = requestAnimationFrame(stepPets);
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts;
  if (!$("#screen-home").classList.contains("on")) return;
  petNodes.forEach(st => {
    const dx = st.tx - st.x, dy = st.ty - st.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 8) {
      if (!st.arrived) {
        st.arrived = true;
        if (st.goal) {
          const d = itemById(st.goal);
          if (d && d.use && Math.random() < 0.8) bubbleAt(st, pick(d.use));
          st.t = rnd(3.5, 8);            // settle in for a while
        } else {
          st.t = rnd(1.5, 5);
        }
      }
      st.t -= dt;
      if (st.t <= 0) { chooseTarget(st); st.arrived = false; }
    } else {
      const sp = 34 * dt;
      st.x += (dx / dist) * sp;
      st.y += (dy / dist) * sp;
      if (Math.abs(dx) > 2) st.face = dx > 0 ? -1 : 1;
    }
    const depth = 0.72 + ((st.y - 400) / 220) * 0.4;
    const resting = st.arrived && st.goal;
    const waddle = dist < 8 ? (resting ? Math.sin(ts / 900) * 1.5 : 0) : Math.sin(ts / 120) * 3;
    st.el.style.left = (st.x / SW) * 100 + "%";
    st.el.style.top = (st.y / SH) * 100 + "%";
    st.el.style.width = (86 * depth / SW) * 100 + "%";
    st.el.style.height = (86 * depth / SH) * 100 + "%";
    st.el.style.zIndex = 30 + Math.round(st.y / 10);
    st.el.style.transform = "translate(-50%,-50%) scaleX(" + st.face + ") rotate(" + waddle + "deg)";
  });
}

function callPet(pid) {
  const st = petNodes.get(pid);
  if (!st) return;
  st.tx = SW / 2 + rnd(-90, 90);
  st.ty = rnd(470, 560);
  st.goal = null;
  st.arrived = false;
  openChat(pid);
}

/* ------------------------------------------------------------
   Conversation
   ------------------------------------------------------------ */
const COLOUR_CHOICES = [0, 1, 2, 3, 4, 5, 6, 8, 9];
const SNACKS = ["peas", "blueberries", "toast crusts", "watercress", "oats"];

function roomHas(id) { return (room().items || []).some(it => it.id === id); }
function wallName() { const w = WALLS.find(x => x.id === room().wall); return w ? w.name.toLowerCase() : "plain"; }
function thingCount() { return (room().items || []).length; }

function chatNode(pid, key, arg) {
  const p = PETS.find(x => x.id === pid);
  const d = petData(pid);
  const you = d.answers;
  const menu = () => {
    const opts = [
      { t: "How are you?", go: "mood" },
      { t: "What's your favourite colour?", go: "colour" },
      { t: "What do you do all day?", go: "day" },
      { t: "Do you like the room?", go: "room" },
      { t: "Tell me something.", go: "story" },
      { t: "Are you hungry?", go: "food" },
      { t: "Want to play?", go: "play" },
      { t: "Bye for now.", go: "bye" }
    ];
    return shuffle(opts.slice(0, 7)).slice(0, 3).concat([{ t: "Bye for now.", go: "bye" }]);
  };

  switch (key) {
    case "hello": {
      const first = d.chats === 0;
      const line = first
        ? pick([
            "Oh! Hello. I live here now, apparently. I like it.",
            "Hi hi hi. Is this my house? It's my house.",
            "You're the one who does all that typing. I like the sound."
          ])
        : pick([
            "You're back.",
            "I was just thinking about you. Well, about snacks. But also you.",
            "Hello again. Nothing has happened. It's been lovely.",
            you.colour != null
              ? "I still think about you liking " + DUCKS[you.colour].name + ". Good taste."
              : "What shall we talk about?",
            thingCount() > 6 ? "This room is getting busy. In a good way." : "It's quiet in here. I like quiet."
          ]);
      return { line, opts: menu() };
    }

    case "mood": {
      const line = roomHas("pad")
        ? pick(["Warm. Sleepy. There's a pad over there with my name on it.", "Good. I had four naps.", "Very well, thank you. The pad is exactly the right amount of soft."])
        : roomHas("pool")
          ? pick(["Damp, in the best way.", "I've been in the pool. Twice.", "Excellent. Wet. Excellent and wet."])
          : pick(["Fine! A bit floor-ish, but fine.", "Good. A little bored. Mostly good.", "I'm well. I watched a dust mote for an hour."]);
      return { line, opts: [{ t: "That's good to hear.", go: "warm" }, { t: "Anything you need?", go: "need" }, { t: "Something else.", go: "hello" }] };
    }

    case "need": {
      const missing = PET_ITEMS.filter(i => !ownedCount(i.id));
      const line = missing.length
        ? pick(["Well. Since you ask. A " + missing[0].name.toLowerCase() + " would be wonderful.",
                "I would never ask. But a " + missing[0].name.toLowerCase() + ". Just so you know.",
                "Nothing! Nothing at all. Unless you were passing a " + missing[0].name.toLowerCase() + "."])
        : pick(["Nothing. You've given me everything. It's embarrassing.", "I have it all. Look at this place.", "Not a thing. I'm the luckiest duck on this floor."]);
      return { line, opts: [{ t: "I'll see what I can do.", go: "warm" }, { t: "Something else.", go: "hello" }] };
    }

    case "colour": {
      const fav = DUCKS[p.fav];
      return {
        line: pick([
          "Mine is " + fav.name + ". Obviously. Look at me.",
          fav.name + ". It sounds like a " + fav.label + ", which is the best of the sounds.",
          "Easy. " + fav.name + ". I have thought about this a great deal."
        ]) + " What about you?",
        opts: shuffle(COLOUR_CHOICES.slice()).slice(0, 3).map(i => ({ t: DUCKS[i].name, go: "colourYou", arg: i }))
          .concat([{ t: "I can't pick.", go: "colourNone" }])
      };
    }

    case "colourYou": {
      d.answers.colour = arg;
      save();
      const same = arg === p.fav;
      const line = same
        ? pick(["The same as me! I knew it. I KNEW it.", "Ha! Same. We are clearly the same duck.", "Excellent answer. Obviously."])
        : pick([DUCKS[arg].name + ". Hm. Bold. I respect it.",
                DUCKS[arg].name + "? That's the " + DUCKS[arg].label + " one. Very relaxing.",
                "Oh, " + DUCKS[arg].name + " is lovely. I'll remember that."]);
      return { line, opts: [{ t: "What else do you like?", go: "likes" }, { t: "Something else.", go: "hello" }, { t: "Bye for now.", go: "bye" }] };
    }

    case "colourNone":
      return {
        line: pick(["Very wise. They're all good.", "That's the correct answer, actually.", "Fair. Choosing is hard and the colours are all doing their best."]),
        opts: [{ t: "Something else.", go: "hello" }, { t: "Bye for now.", go: "bye" }]
      };

    case "likes":
      return {
        line: pick(["Warm floors. The " + wallName() + " wallpaper. You, a bit.",
                    "Snacks. Sitting. The specific corner over there.",
                    "The sound the board makes when a colour goes down. Thock."]) + " What's your snack?",
        opts: shuffle(SNACKS.slice()).slice(0, 3).map(s => ({ t: s, go: "snackYou", arg: s }))
      };

    case "snackYou": {
      d.answers.snack = arg;
      save();
      return {
        line: arg === p.snack
          ? pick(["" + arg + "! My exact snack. We're going to get along.", "Same. Obviously same."])
          : pick([arg + ". Interesting. I'd try one.", "Hm, " + arg + ". I'll allow it.", "Noted. " + arg + ". I'll remember that about you."]),
        opts: [{ t: "Something else.", go: "hello" }, { t: "Bye for now.", go: "bye" }]
      };
    }

    case "day": {
      const stuff = petStuffInRoom();
      const line = stuff.length
        ? pick(["Waddle to the " + (itemById(stuff[0].id) || {}).name.toLowerCase() + ". Sit. Waddle back. It's a full schedule.",
                "Mostly I patrol. This room does not patrol itself.",
                "Sleep, snack, stare at the wall, sleep. Some days I mix the order."])
        : pick(["Nothing. Gloriously nothing.", "I walk from here to there, then back. It's very fulfilling.", "I think about water a lot."]);
      return { line, opts: [{ t: "Sounds perfect.", go: "warm" }, { t: "Something else.", go: "hello" }] };
    }

    case "room": {
      const n = thingCount();
      const line = n === 0
        ? pick(["It's very... roomy. Lots of potential.", "Empty! Loads of space for running. Not complaining."])
        : n < 5
          ? pick(["Coming along. I like what you've done with the " + wallName() + ".", "It's getting cosy. Keep going."])
          : pick(["It's wonderful. I've hidden something behind one of these and I won't say which.",
                  "Honestly? Best room I've lived in. It's the only room I've lived in, but still.",
                  "I love it. The " + wallName() + " wallpaper especially."]);
      return { line, opts: [{ t: "I'll add more.", go: "warm" }, { t: "Where would you like things?", go: "arrange" }, { t: "Something else.", go: "hello" }] };
    }

    case "arrange":
      return {
        line: pick(["Near the middle. I like to be in the way.",
                    "By the wall, so I can nap against it.",
                    "Wherever. Then move it. I enjoy the drama of furniture moving."]),
        opts: [{ t: "Noted.", go: "warm" }, { t: "Something else.", go: "hello" }]
      };

    case "story":
      return {
        line: pick([
          "A duck can sleep with one eye open. I do it when you rearrange the couch.",
          "I once walked in a perfect circle for six minutes. No reason. It was great.",
          "Secret: I know which square you're going to tap before you do. I'm usually wrong.",
          "There's a crumb under the rug from level nine. I'm saving it.",
          "Every duck in the pond has a different keyboard. Mine is the best one.",
          "I like the quiet clicks best. The loud ones startle me, and then I like them.",
          "If you nap in a sunbeam, the nap counts double. That's just physics."
        ]),
        opts: [{ t: "Tell me another.", go: "story" }, { t: "Something else.", go: "hello" }, { t: "Bye for now.", go: "bye" }]
      };

    case "food": {
      const line = roomHas("bowl") || roomHas("treats")
        ? pick(["Always. But there's a bowl, so I'm fine. Mostly fine. Check the bowl?",
                "I have a bowl! I am a duck with a bowl.",
                "A little. I'm rationing myself. It's going badly."])
        : pick(["Yes. Devastatingly. There's no bowl in here, you know.",
                "Since you mention it, there is no seed bowl in this room. Just an observation.",
                "Hungry-ish. Hypothetically, if a bowl existed, I would use it."]);
      return { line, opts: [{ t: "I'll sort it out.", go: "warm" }, { t: "Something else.", go: "hello" }] };
    }

    case "play": {
      const toys = petStuffInRoom().filter(it => ["ball", "wheel", "pool", "feather", "ramp"].indexOf(it.id) > -1);
      if (toys.length) {
        const it = pick(toys);
        const st = petNodes.get(pid);
        if (st) { st.goal = it.id; st.tx = clamp(it.x, 110, 890); st.ty = clamp(it.y + 18, 410, 585); st.arrived = false; }
        return {
          line: pick(["Yes! Watch this.", "Say no more. I'm going.", "Finally. Someone asked."]),
          opts: [{ t: "Go on then.", go: "close" }, { t: "Something else.", go: "hello" }]
        };
      }
      return {
        line: pick(["With what? I have no toys. I have vibes.",
                    "I'd love to. There's nothing in here to play with, mind you.",
                    "Yes! ...with what, though."]),
        opts: [{ t: "I'll find you something.", go: "warm" }, { t: "Something else.", go: "hello" }]
      };
    }

    case "warm":
      return {
        line: pick(["You're nice.", "Thank you. I mean it.", "This is a good day.", "*small pleased noise*"]),
        opts: [{ t: "Something else.", go: "hello" }, { t: "Bye for now.", go: "bye" }]
      };

    case "bye":
    default:
      return {
        line: pick(["Bye! I'll be right here. I'm always right here.",
                    "Go on then. Tap some squares for me.",
                    "See you. Bring snacks.",
                    "Bye. I'm going to sit down now."]),
        opts: [{ t: "See you soon.", go: "close" }]
      };
  }
}

/* --- the chat panel, typed out one letter at a time --- */
function openChat(pid) {
  Audio_.init();
  chatWith = pid;
  const p = PETS.find(x => x.id === pid);
  $("#chatArt").innerHTML = duckArt(p.hex, { blush: true });
  $("#chatName").textContent = p.name;
  $("#chatPanel").hidden = false;
  $("#screen-home").classList.add("chatting");
  const st = petNodes.get(pid);
  if (st) { st.t = 99; st.arrived = true; }        // stand still while talking
  goChat("hello");
}

function closeChat() {
  clearTimeout(typeTimer);
  const st = chatWith && petNodes.get(chatWith);
  if (st) { st.t = 0; }
  chatWith = null;
  $("#chatPanel").hidden = true;
  $("#screen-home").classList.remove("chatting");
}

function goChat(key, arg) {
  if (!chatWith) return;
  const node = chatNode(chatWith, key, arg);
  const d = petData(chatWith);
  if (key === "hello") { d.chats++; save(); }
  if (key === "close") { closeChat(); return; }
  typeLine(node.line);
  const host = $("#chatOpts");
  host.innerHTML = "";
  node.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "chat-opt";
    b.textContent = o.t;
    b.onclick = () => { Audio_.key(pick([0, 3, 9]), 0.7); goChat(o.go, o.arg); };
    host.appendChild(b);
  });
}

function typeLine(text) {
  clearTimeout(typeTimer);
  const el = $("#chatLine");
  el.textContent = "";
  let i = 0;
  const tick = () => {
    el.textContent = text.slice(0, ++i);
    if (i % 3 === 0 && text[i - 1] !== " ") Audio_.key(pick([0, 3, 6, 9]), 0.22);
    if (i < text.length) typeTimer = setTimeout(tick, 17);
  };
  tick();
}

/* ============================================================
   Rooms and screens
   ============================================================ */
function renderRoomTabs() {
  const host = $("#roomtabs");
  host.innerHTML = "";
  ROOMS.forEach(r => {
    const has = S.unlockedRooms.includes(r.id);
    const b = document.createElement("button");
    b.className = "roomtab" + (S.currentRoom === r.id ? " on" : "") + (has ? "" : " locked");
    b.textContent = has ? r.name : r.name + " · level " + r.at;
    b.onclick = () => {
      if (!has) { Audio_.nope(); toast(r.name + " opens at level " + r.at); return; }
      S.currentRoom = r.id;
      selected = null;
      renderHome(); save(); Audio_.tap();
    };
    host.appendChild(b);
  });
}

function renderHome() {
  if (!S.rooms[S.currentRoom]) S.rooms[S.currentRoom] = freshRoom(ROOMS.find(r => r.id === S.currentRoom) || ROOMS[0]);
  renderRoomTabs();
  renderSurfaces();
  renderRoomItems();
  renderPets();
  renderTray();
}

function goHome() {
  if (!homeUnlocked()) { Audio_.nope(); toast("Finish three levels and the house opens up"); return; }
  $("#screen-pond").classList.remove("on");
  $("#screen-home").classList.add("on");
  $("#tabHome").classList.add("on"); $("#tabPond").classList.remove("on");
  renderHome();
}
function goPond() {
  closeChat();
  if (levelDone) newPuzzle(S.level);
  $("#screen-home").classList.remove("on");
  $("#screen-pond").classList.add("on");
  $("#tabPond").classList.add("on"); $("#tabHome").classList.remove("on");
  queueFit();
}
$("#chatClose").onclick = () => { Audio_.tap(); closeChat(); };
$("#tabHome").onclick = () => { Audio_.init(); goHome(); };
$("#tabPond").onclick = () => { Audio_.init(); Audio_.tap(); goPond(); };

function renderTabs() {
  $("#tabHome").classList.toggle("lock", !homeUnlocked());
}

/* ============================================================
   The sound garden under the board
   ============================================================ */
function renderSoundStrip() {
  const host = $("#soundstrip");
  const used = new Set();
  for (let r = 0; r < P.n; r++) for (let c = 0; c < P.n; c++) used.add(P.reg[r][c]);
  host.innerHTML = '<div class="lbl">Tap a duck to hear its ASMR sound</div>';
  Array.from(used).sort((a, b) => a - b).forEach(i => {
    const d = DUCKS[i];
    const b = document.createElement("button");
    b.className = "swatch";
    b.setAttribute("aria-label", d.name + ": " + d.label);
    b.title = d.name + " · " + d.label;
    b.style.background = d.pale;
    b.innerHTML = DUCK_SVG[i] + '<span class="tip">' + d.name + " · " + d.label + '</span>';
    b.onclick = () => {
      Audio_.init(); Audio_.duck(i, false);
      $$(".swatch").forEach(s => s.classList.remove("ring"));
      b.classList.add("ring");
      setTimeout(() => b.classList.remove("ring"), 1800);
    };
    host.appendChild(b);
  });
}

/* ============================================================
   Boot
   ============================================================ */
async function boot() {
  const saved = await Store.get(SAVE_KEY);
  if (saved) {
    S = Object.assign(newState(), saved);
    S.settings = Object.assign(newState().settings, saved.settings || {});
    if (!S.rooms || !Object.keys(S.rooms).length) S.rooms = { cottage: freshRoom(ROOMS[0]) };
  }
  Object.keys(Audio_.state).forEach(k => { if (k in S.settings) Audio_.state[k] = S.settings[k]; });

  if (S.puz && S.puz.cells && S.puz.n) loadPuzzle(S.puz); else newPuzzle(S.level);
  renderTabs();
  renderHome();

  // The title is shown on each launch, while puzzle progress remains saved.
  $("#titleDucks").innerHTML = [1, 0, 3].map(i => '<span class="title-duck">' + DUCK_SVG[i] + '</span>').join("");
  document.body.classList.add("at-title");
  $("#screen-title").classList.add("on");
  $("#titlePlay").onclick = () => { Audio_.init(); Audio_.tap(); showHowTo(); };
  $("#titleSettings").onclick = () => $("#btnSettings").click();
  if (!S.seenIntro) { S.seenIntro = true; save(); }
}

/* the first touch anywhere wakes the audio up */
document.addEventListener("pointerdown", function once() {
  Audio_.init();
  document.removeEventListener("pointerdown", once);
}, { once: true });

/* ============================================================
   Fit the pond to the screen
   The board takes whatever height is left after the header, level card,
   tools, sound strip and nav. If even the smallest board cannot fit, the
   middle area scrolls (page scrolling is off inside the native app).
   ============================================================ */
let fitQueued = false;
function fitLayout() {
  fitQueued = false;
  const app = $("#app"), scr = $("#screen-pond");
  const vet = !!(S && S.level > 3);
  app.classList.toggle("veteran", vet);
  app.classList.toggle("tight", window.innerHeight < 780 && vet);
  if (!scr.classList.contains("on")) return;
  const wrap = scr.querySelector(".pondwrap");
  const strip = $("#soundstrip");
  const cs = getComputedStyle(scr);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const availW = scr.clientWidth - padX - 8;              // room for the board shadow

  // sound strip: one row when the swatches stay finger-sized, otherwise two even rows
  const n = strip.querySelectorAll(".swatch").length || 1;
  const sCS = getComputedStyle(strip);
  const inner = strip.clientWidth - parseFloat(sCS.paddingLeft) - parseFloat(sCS.paddingRight) - 6;
  const g = 6;
  let sw = Math.floor((inner - (n - 1) * g) / n);
  if (sw < 30) { const per = Math.ceil(n / 2); sw = Math.floor((inner - (per - 1) * g) / per); }
  const cap = app.classList.contains("tight") ? 36 : 46;
  strip.style.setProperty("--sw", Math.max(28, Math.min(cap, sw)) + "px");
  strip.style.columnGap = g + "px";

  // board: what is left of the height
  const gap = parseFloat(getComputedStyle(wrap).rowGap) || 12;
  let used = 0, kids = 0;
  for (const el of wrap.children) {
    if (el.id === "boardwrap") continue;
    used += el.getBoundingClientRect().height; kids++;
  }
  const availH = scr.clientHeight - padY - used - gap * kids - 8;
  const floor = window.innerHeight < 700 ? 230 : 250;     // below this the cells get too small to tap; scroll instead
  const size = Math.floor(Math.max(Math.min(availW, floor), Math.min(520, availW, availH)));
  document.documentElement.style.setProperty("--board", size + "px");
}
function queueFit() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitLayout); } }
window.addEventListener("resize", () => { positionTools(); queueFit(); });
window.addEventListener("orientationchange", () => setTimeout(queueFit, 250));
if (window.visualViewport) visualViewport.addEventListener("resize", queueFit);
if (window.ResizeObserver) {
  const ro = new ResizeObserver(queueFit);
  ro.observe($("#screen-pond")); ro.observe($(".levelcard")); ro.observe($("#soundstrip"));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);
boot().then(queueFit);


</script>

    navigator.serviceWorker.register("sw.js").catch(() => { /* running without a service worker is fine */ });
  });
}
