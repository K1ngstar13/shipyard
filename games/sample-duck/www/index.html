<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample Duck</title>
<style>
  body { margin:0; height:100dvh; display:grid; place-content:center; gap:18px; justify-items:center;
    background:#8FD3F4; font:600 20px/1.3 system-ui,sans-serif; color:#123; text-align:center; }
  #duck { font-size:96px; border:0; background:none; }
  #score { font-size:44px; font-weight:800; }
  #pond { padding:14px 22px; border-radius:16px; border:0; background:#123; color:#fff; font:600 17px system-ui; }
</style>
</head>
<body>
  <div id="score">0</div>
  <div>taps</div>
  <button id="duck" aria-label="Tap the duck">🦆</button>
  <button id="pond">Visit the pond</button>
<script>
  let n = 0;
  const score = document.getElementById('score');
  document.getElementById('duck').onclick = () => { n++; score.textContent = n; };
  document.getElementById('pond').onclick = () => { document.body.style.background = '#3FA796'; };
</script>
</body>
</html>
